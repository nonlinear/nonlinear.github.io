<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nonlinear</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    main { text-align: center; max-width: 32rem; }
    h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #f0f0f0, #888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      font-size: 1.125rem;
      line-height: 1.6;
      color: #666;
      margin-bottom: 0.5rem;
    }
    .tagline {
      font-size: 0.875rem;
      color: #444;
      font-style: italic;
      margin-bottom: 2.5rem;
    }
    nav { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }
    a {
      color: #888;
      text-decoration: none;
      font-size: 0.875rem;
      transition: color .2s;
    }
    a:hover { color: #e0e0e0; }
  </style>
</head>
<body>
  <main>
    <h1>Nonlinear</h1>
    <p>Studio. Design, produto, pesquisa.</p>
    <p>Brand · Editorial · Systems</p>
    <p class="tagline">cognition bleeds</p>
    <nav>
      <a href="https://nonlinear.nyc/personal/">/personal</a>
      <a href="https://github.com/nonlinear">github</a>
      <a href="https://nonlinear.nyc">nonlinear.nyc</a>
    </nav>
  </main>
</body>
</html>
