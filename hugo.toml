baseURL = "https://nonlinearstudio.org/"
locale = "en-us"
title = "Nonlinear Studio"
publishDir = "docs"
disableKinds = ["sitemap", "rss", "taxonomy", "term"]
disableHugoGeneratorInject = true

# TODO(copy): hardcoded for now, duplicated from branding-exercise.
#   Future: wire through ONE source of truth (see RESEARCH-doc-site-feedback-loop.md, P2).
#   "nome do site, descricao do site, hardcoded, duplicada. futuro, a gente fala
#    'na real, pega o conteudo daqui' logo ONE source of truth."
[params]
  name = "Nonlinear Studio"
  slogan = "cognition bleeds"
  description = "Studio. Design, produto, pesquisa. Brand · Editorial · Systems."

# Markdown — GFM-compatible output. `unsafe` lets content carry the small amount
# of raw HTML the doc layer needs (<kbd>, <var>); structure still comes from
# markdown + render hooks, never from hand-written divs.
[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions]
  typographer = true
