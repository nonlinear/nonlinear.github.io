{{ define "main" }}
<article class="project">
  <p class="eyebrow">{{ with .Params.tier }}{{ . }}{{ else }}product{{ end }}</p>
  <h1>{{ .Title }}</h1>
  {{ with .Params.slogan }}<p class="lede">{{ . }}</p>{{ end }}
  {{ partial "components/figure.html" (dict "label" (printf "%s — hero" .Title)) }}
  <div class="content">{{ .Content }}</div>
</article>
{{ end }}
