<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .Title }}{{ .Title }} — {{ end }}Nonlinear</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0a0a; color: #e0e0e0; }
    header, main, footer { padding: 1.5rem 2rem; max-width: 48rem; margin: 0 auto; }
    header { padding-top: 3rem; border-bottom: 1px solid #222; }
    nav a { color: #888; text-decoration: none; margin-right: 1.5rem; font-size: .875rem; }
    nav a:hover { color: #e0e0e0; }
    h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); font-weight: 300; }
    h2 { font-size: 1.25rem; font-weight: 400; color: #aaa; margin-top: 2rem; }
    p { color: #666; line-height: 1.6; margin-top: .75rem; }
    ul { list-style: none; margin-top: 1rem; }
    li { margin-bottom: 1rem; }
    li a { color: #aaa; font-size: 1.125rem; text-decoration: none; }
    li a:hover { color: #e0e0e0; }
    li small { display: block; color: #444; font-size: .8rem; margin-top: .2rem; }
    footer { margin-top: 3rem; border-top: 1px solid #222; color: #444; font-size: .8rem; }
  </style>
</head>
<body>
<header>
  <nav>
    <a href="/">Nonlinear</a>
    <a href="/projects">Projects</a>
    <a href="/articles">Articles</a>
    <a href="https://nonlinear.nyc/personal/">/personal</a>
  </nav>
</header>
<main>
{{ block "main" . }}{{ end }}
</main>
<footer>Nonlinear Studio · cognition bleeds</footer>
</body>
</html>
