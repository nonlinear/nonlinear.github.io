sections:
- key: active
  items:
  - id: P13E004
    label: 1
    title: Reels Index
    goal: 'A personal visual index of referenced media, searchable and navigable by tag. A source adapter
      is the only thing a new host requires, and Instagram is the first one. The video is not stored:
      the reference, its metadata and its tags point back to the host.'
  - id: P13E008
    label: 2
    title: Art Study
    goal: The agent covers art learning, starting with charcoal and widening to materials, techniques
      and drawing or painting schools in the city. Each entry is a study item with a source, not a bookmark.
  - id: P13E009
    label: 3
    title: Tool Audit
    goal: Every MCP and skill available to the agent is audited, its access is documented, and the blockers
      are resolved or named. Missing tools are written down with what they would enable.
- key: planning
  items:
  - id: P13E001
    label: 1
    title: Collection Engine
    goal: One engine serves visual collections. A path selects a collection and a viewer, the root path
      is the public default, and other paths exist without being advertised. Functional capacity grows
      without multiplying the operational surface.
  - id: P13E002
    label: 2
    title: Hidden Viewer
    goal: 'A references path exists as an alternate viewer: one image at a time, chosen at random, changing
      every thirty minutes. No link and no readme point at it. Whoever knows the path knows it.'
  - id: P13E003
    label: 3
    title: Charcoal Sources
    goal: Reference books on charcoal drawing are collected and organized, with the ones already in the
      library kept where they are and the missing ones acquired. The set is complete enough to study from
      without searching again.
  - id: P13E005
    label: 4
    title: Reels Scraping
    goal: A scheduled scrape detects newly saved reels and injects them into the index, so a save becomes
      a searchable reference without a manual pass. The source adapter for a second host is planned on
      the same contract.
  - id: P13E006
    label: 5
    title: Reels Design
    goal: 'The visual layer of the reels index is defined and built: the grid with tag search, the thumbnail,
      and the modal that shows the media. The technical path is closed and versioned elsewhere; this epic
      holds only the work that comes after it.'
  - id: P13E010
    label: 6
    title: Hashtag Vocabulary
    goal: A vocabulary layer enriches the raw tags of any source with concepts, aliases and translations,
      at the same level as a source adapter and not as a cleaner after the fact. The layer is planned
      and SKOS-aligned; it does not act yet.
  - id: P13E015
    label: 7
    title: Traffic Cap
    goal: 'When traffic exceeds capacity the service degrades on purpose instead of failing: requests
      are rate limited at the proxy and the CDN, and a busy page stands in for the collection. The cap
      is a number the operator sets, not an outage.'
  - id: P13E016
    label: 8
    title: Immich Conversion
    goal: 'The library conversion is decided from measured numbers on the real collection, not from a
      readme estimate: whether to convert originals to newer formats, at what saving, and what breaks.
      The answer is a decision with evidence attached.'
