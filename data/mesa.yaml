- key: active
  items:
  - id: P12E001
    label: 1
    title: PostHog Adoption
    goal: PostHog runs self-hosted as the fleet event substrate. Events are defined once, queries answer
      questions about use, and the active epics write to it through one integration instead of their own
      hooks. One store, one query surface, no second analytics path.
  - id: P12E003
    label: 2
    title: Tool Audit
    goal: Every MCP, skill and tool available to the agent is listed with what it actually does, and the
      gaps are named with a priority. A capability the agent lacks is written down as a missing tool instead
      of being rediscovered on each task.
  - id: P12E006
    label: 3
    title: Projected Interface
    goal: A camera and a projector are calibrated as one instrument, so a graphic interface can be drawn
      onto a physical object and stay registered to it. The projection follows the object, not the screen.
  - id: P12E009
    label: 4
    title: Bench Surface
    goal: 'The project runs as a formal experimental tier with a declared group and one public surface:
      a bench that serves an HTML page. The first experiment is the page that asks for camera permission,
      which is the entry point of the projection axis.'
  - id: P12E010
    label: 5
    title: Capture Hardware
    goal: 'The studio has one source for capture and projection hardware decisions: what is for sale,
      what exists only in research, and what has to be built. Each device becomes a note with verified
      specs, a source and a verdict that traces to an experiment.'
