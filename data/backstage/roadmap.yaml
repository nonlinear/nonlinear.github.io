    goal: "Treat Backstage as a single-lane PRODUCT. What started as \"Backstage with checks\" consolidated into a system of methodology + distribution + governance + observability for agents/projects. backstage-as-product ABSORBS preparing-backstage-for-public-release: it defines both WHAT we want (product vision) and HOW we build it (engineering/adoption). A friend of nonlinear takes the technical side (architecture, code, infra, automation); nonlinear takes the product side (positioning, value, who adopts, go-to-market, narrative). This epic is the recorded reasoning. Next step: validate the architecture against experts via library books before freezing foundations (ID/version/license/ permissioning schemas deliberately left open). ⚡ MIGRATED 2026-09-28: absorvido pelo epic `product-brief` (backstage) — o product understanding vira deliverable do novo epic; este contrato permanece como fonte histórica (visão §3 + validação §3A + glossário §10)."
    status: migrated
  - id: "e009_20260630"
