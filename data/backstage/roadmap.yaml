    goal: "Read-only interface for projects and epics"
    status: done
  - id: "backstage-orchestration"
    kind: project
    title: "Backstage Orchestration — parity queue + deterministic scheduling"
    goal: "O heartbeat NÃO é 'cada agente roda a cada 2h'. É: parity queue + deterministic scheduling — o scheduler decide quem roda agora; o heartbeat é só o clock."
    status: migrated
  - id: "e076_20260518"
    kind: project
    title: "Backstage runtime — from watchers to hooks"
    goal: "Migrated from old backstage (E076)"
    status: migrated
  - id: "e018_20260630"
    kind: project
    title: "Backstage Skill Update"
    goal: "Update OpenClaw backstage skill to reflect Hugo migration and current workflow"
