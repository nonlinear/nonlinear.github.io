# ROADMAP — projeção de descoberta (gerado por roadmap-projector)
# project: backstage
# source: epics/ + workspace/epics/  (epics são a fonte de verdade; este arquivo é índice derivado)
# projector: roadmap-projector v2.1
# NOTA: NÃO editar manualmente — o Parity regenera a partir dos epics. Git registra delta.
epics:
  - id: "P02E001"
    kind: project
    title: "MCP Management — Stage 3: Backstage Catalog"
    goal: "Backstage oferece o catálogo (Stage 3) de MCPs: cada servidor registrado com escopo, dono e ferramenta exposta. Qualquer agente consulta o catálogo antes de declarar que uma capacidade não existe."
    status: backlog
  - id: "P02E002"
    kind: project
    title: "Horizontal Agents — formalizar topologia vertical/horizontal e o protocolo de chamada"
    goal: "Formalizar a topologia vertical/horizontal/híbrido do PETNA JÁ DECIDIDA (A2/A22) e — o que falta — definir o PROTOCOLO de chamada/atuação: como um agente horizontal é INVOCADO e COMO AGE SOBRE os verticais (e vice-versa). Hoje a topologia existe mas o mecanismo de interação (quem chama quem, com qual contrato, em qual modo) é implícito. Este epic torna explícito o modo de interação entre agentes do ecossistema, ancorado nos três modos de interação de Team Topologies (collaboration / X-as-a-Service / facilitating)."
    status: backlog
  - id: "P02E003"
    kind: project
    title: "Agents Cleanup — sanitize agents folder, migrate about/identity.md, enforceable rules"
    goal: "Clean up and sanitize the agents folder: migrate the narrative content of `about/identity.md` (currently NOT machine-read) to actionable OpenClaw surfaces (SOUL.md / AGENTS.md / TOOLS.md), remove stale/duplicate identity files, and define enforceable rules so the folder stays clean."
    status: backlog
  - id: "P02E004"
    kind: project
    title: "Checkpoint Machine"
    goal: "The lifecycle machine is proven: a status change fires a checkpoint that runs checks, each check returns pass or fail, all passing authorizes the transition, and any failure rejects it and records the result. The minimum structure of check and checkpoint works with one toy check, before any real policy exists."
    status: active
  - id: "P02E005"
    kind: project
    title: "ID Collisions"
    goal: "Two epics that share the same id cannot be told apart by the roadmap projection, and eighteen groups do. The target is an id that is the identity of the epic and not of its container, so the epic migrates without changing name. The epic closes when every id in the ecosystem is unique."
    status: planning
  - id: "P02E006"
    kind: project
    title: "Roadmap Registry Cleanup — de histórico operacional para control-plane state"
    goal: "Transformar o `workspace/ROADMAP.yaml` (registry de reconciliação do backstage) de **histórico operacional** (P10E017 de ciclos + estado) em **control-plane state** (só intenção operacional viva). O histórico de ciclos vai para o Git; o arquivo fica com o estado operacional necessário: quem reconcilio, tiers, e — novo — a rollout policy (qual projeto recebe qual versão de P08E047). Renomear para `registry.yaml` para eliminar a ambiguidade com `about/roadmap.yaml`."
    status: backlog
  - id: "P02E007"
    kind: project
    title: "Multi-User — Backstage com mais de um usuário por projeto"
    goal: "Garantir que o Backstage funciona com mais de um usuário por projeto — compartilhamento de repo de projeto, especialmente sob P08E047 hygiene e migração multi-editor. Premissas e riscos ainda em thought exercise (ver §Riscos)."
    status: backlog
  - id: "P02E008"
    kind: project
    title: "Parity v3.6 — domains configuration/interfaces + modo promotion"
    goal: "Evoluir a skill P08E047 v3.5 → v3.6: (a) adicionar `P06E001` e `interfaces` à tabela de DOMAINS reconciliáveis (sem skill/domain novo por tipo — domains continuam entrando no mesmo mecanismo); (b) formalizar `promotion` como MODO DE INVOCAÇÃO do protocolo sobre um candidate congelado (release-gate de P02E024), não novo domain nem novo protocol; (c) seguir o ciclo da própria P08E047 (dry-run → impact → off-ramp → migration) antes de propagar aos consumidores (Kin, Nonlinear, Librarian). Documentar como evidência os findings de produto do Librarian (domínios P06E001/interfaces), não como requisito Librarian-only."
    status: backlog
  - id: "P02E009"
    kind: project
    title: "Dashboard — visual representation of backstage/agent state (calendar, epics, costs, trends)"
    goal: "Give the operator (nonlinear) a single visual surface over the backstage ecosystem: what epics exist / their status, upcoming agenda (calendar/tasks/memory/context), costs trends, and parity/observability signals — instead of digging through files. Absorbs the agenda-visual-day (visual day representation) and epic-costs (weekly model-cost reconciliation) ideas as notes."
    status: backlog
  - id: "P02E010"
    kind: project
    title: "Context Pollution — detect and mitigate conflicting prompts that degrade or disable Backstage core"
    goal: "Inform and guide the user on how to DETECT and MITIGATE conflicting prompts that may reduce — or even prevent — Backstage core from working. Context pollution is when harness prompts, policies, memory, or agent instructions conflict with Backstage's protocol, so the Core silently stops functioning (drift, ignored checks, skipped parity, malformed epics) even though nothing \"errors.\""
    status: backlog
  - id: "P02E011"
    kind: project
    title: "Multi-Harness — run Backstage (and other products) seamlessly across harnesses"
    goal: "Make Backstage (and other products) run seamlessly across MULTIPLE harnesses. Today we work on OpenClaw; other harnesses are possible (Hermes, Claude Code, pi, …). One methodology/protocol that installs and behaves the same regardless of host — with harness-specific behavior isolated in adapters, never in the Core. RENAMED 2026-09-16 (nonlinear): \"normalization\" is ONE deliverable of multi-harness, not the whole thing. Other deliverables: test environment, analysis, adapters, conformance, per-harness capability discovery. Implements `backstage-as-product` §3.32 (harness-agnostic by design) and §3.33 (cross-harness conformance testing)."
    status: backlog
  - id: "P02E012"
    kind: project
    title: "Check Presets — tags, presets and non-hierarchical selection (beyond global|project)"
    goal: "Extend check scope beyond the current hierarchical model (global | project) with TAGS and PRESETS. Today scope is hierarchical — global or project — which is fine: projects must manually assemble common logic. But in the future, language and project-type should carry their OWN preset of checks at certain points: flutter → this check at that trigger, this check at another trigger; hugo → the same; experimental projects → the same; flagship projects → the same. A preset is therefore ANOTHER CHECK COLLECTION that you can USE, CREATE or CUSTOMIZE. FUTURE STATE — recorded now, built later."
    status: backlog
  - id: "P02E013"
    kind: project
    title: "ID Normalization — a scalable, best-practice ID syntax"
    goal: "Establish a stable machine identity for every epic without making the human-facing title part of the identity. ID = P<agent>E<epic> (imutável, único por construção); title = fantasy name (mutável); folder = ID. Migrar epics OPEN para o novo schema (contagem nova por agente); closed permanecem frozen. Schema em policies/epic-schema.yaml (fonte única); parity enforça."
    status: done
  - id: "P02E014"
    kind: project
    title: "Edit Needed"
    goal: "Define EDIT_NEEDED as a new verdict: the check identifies a concrete, actionable edit that an agent can apply autonomously. The agent applies edits, the checkpoint re-runs, and both rounds are recorded as commits. If edits break another check, the second round catches it."
    status: backlog
  - id: "P02E015"
    kind: project
    title: "Help Evaluation — decision machine (Checkpoint that synthesises decisions)"
    goal: "Define the DECISION side of help_needed: given collected responses + evidence, run them through decision criteria as a Checkpoint, produce a synthesis report, and surface a decision outcome. Sibling to the demand machine (help-needed). Procurement discipline name: evaluation committee / scoring matrix / award memo."
    status: backlog
  - id: "P02E016"
    kind: project
    title: "Demand Intake"
    goal: "A project declares a need, receives responses, and each response becomes work items. The intake side owns the declaration, the response lifecycle and the routing to tickets, following procurement discipline: the request is published, proposals arrive, and each proposal is a vendor thread."
    status: planning
  - id: "P02E017"
    kind: project
    title: "Product Brief — Backstage (product understanding)"
    goal: "Executar o skill P02E017 sobre o Backstage: P14E006 responde as 14 áreas do giant prompt; backstage analisa e consolida em about/P02E017.md (destilação YAML + corpo de evidência), consumido downstream pelo P14E006 portfolio. Absorve backstage-as-product (MIGRATED): a visão §3, a validação §3A e o glossário §10 são a matéria-prima da entrevista. Deliverable = /about object, não posicionamento."
    status: backlog
  - id: "P02E018"
    kind: project
    title: "Debugging"
    goal: "Migrated from old backstage (E072)"
    status: backlog
  - id: "P02E019"
    kind: project
    title: "Epic Protocol v2 — structural parity / protocol migration test"
    goal: "Test whether the system can change its own structural epic protocol and certify migration of the live artifacts — without migrating project by project manually. It is a compliance experiment (protocol migration), not a compliance abstraction."
    status: backlog
  - id: "P02E020"
    kind: project
    title: "Nimble Companies"
    goal: "The concept of a nimble company is explored and written: an organization that operates with autonomous agents in deterministic workflows. The studio is positioned as the standard handshake protocol between those agents and those companies."
    status: active
  - id: "P02E021"
    kind: project
    title: "Ideas Parking Lot — System Improvements"
    goal: "Um epic-parking-lot de SYSTEM IMPROVEMENTS: memória de \"coisas que percebemos durante o trabalho e que podem melhorar o sistema\". Não é um backlog genérico — cada entrada tem origem, feedback original, contexto, interpretação, possíveis ações, status e — acima de tudo — PROVENIÊNCIA (quem disse o quê). O consumer do feedback vive aqui: o feedback não morre quando o ticket arquiva."
    status: backlog
  - id: "P02E022"
    kind: project
    title: "Cognition Policy"
    goal: "The policy is canonical: before increasing the intelligence of the model, ask whether the environment can already carry the answer. Nurture the environment, not the model. The four questions and the conformance test that enforce it are part of the policy, not advice beside it."
    status: active
  - id: "P02E023"
    kind: project
    title: "Writing Head"
    goal: "The group that holds how agents write epics consolidates the writing and quality epics into notes for analysis, under one criterion: lose nothing. The provisional name does not matter. The contract of the group is still undecided, so nothing is executed yet."
    status: planning
  - id: "P02E024"
    kind: project
    title: "Publication — generalizing backstage for adoption (flagship)"
    goal: "Design e roadmap de como transformar o backstage em algo generalizável e publicável — com conceito flagship, layer de abstração, e processo de extração — sem quebrar o uso próprio."
    status: backlog
  - id: "P02E025"
    kind: project
    title: "Repo Reconciliation — enforcement commit no .openclaw + propagação do skill"
    goal: "Resolver a arquitetura de versionamento/enforcement do workspace vivo (repo ~/.openclaw) e propagar o modelo novo de escrita ao ponto que os agentes realmente consomem (o skill parity). Hoje o enforcement está desacoplado do repositório onde os documentos vivem, e o desenho v2 não chegou aos agentes."
    status: backlog
  - id: "P02E026"
    kind: project
    title: "Rethink Composites"
    goal: "**Composites are organizational structures in Backstage, but their role and value are unclear.**"
    status: backlog
  - id: "P02E027"
    kind: project
    title: "Retroactive Epics — methodology for creating docs from git history + code"
    goal: "Explore whether/how Backstage can derive documentation from git history and code: a repeatable methodology (not a one-off audit) for retroactive doc generation. Feasibility is the open question — \"if it's even possible.\""
    status: backlog
  - id: "P02E028"
    kind: project
    title: "Reusable Policies (Nonlinear Studio Methodology)"
    goal: "Reusable-policies methodology: permanent normative knowledge, discovered by intent before any work, generalizable to all agents. The FIRST methodology policy. Owned by the Studio, used by Kin + Librarian (clients)."
    status: backlog
  - id: "P02E029"
    kind: project
    title: "Second Brain Setup Guide (Obsidian + Claude Code)"
    goal: "Setup guide for Obsidian vault as source of truth with Claude Code access via MCP"
    status: backlog
  - id: "P02E030"
    kind: project
    title: "Session Management Companion Skill"
    goal: "Skill for managing OpenClaw sessions - list, archive, and define agents per session"
    status: backlog
  - id: "P02E031"
    kind: project
    title: "Status Schema"
    goal: "There is one canonical source of statuses for policies and for skills, read by the validator, with the heartbeat reconciling drift. It mirrors what the epic schema already does for epics, so a status is a value the machine knows instead of a word a writer chooses."
    status: active
  - id: "P02E032"
    kind: project
    title: "Organization Level"
    goal: "The canonical organization level is defined: a sibling of the agents directory that holds artifacts shared by every agent and owned by none. Today it does not exist, because the work-location policy models the inside of the agents directory and stops there."
    status: active
  - id: "P02E033"
    kind: project
    title: "Heartbeat × memory: wire the reconciliation loop to the event store"
    goal: "Ligar o heartbeat (drift scan + ecosystem health + enforcement/parity history + ticket delivery) à superfície de memória (JSONL → DuckDB, skills/memory). Hoje o heartbeat decide 'clean vs drift' sem consultar histórico; a superfície existe e está verificada."
    status: backlog
  - id: "P02E034"
    kind: project
    title: "Project Tiers"
    goal: "The studio has three project tiers: flagship, experimental and collab. Each project declares its tier, the public experience derives from it in resources and attention, and the tier itself is never exposed to the reader. The rules, the assignations and the enforcement are part of the taxonomy."
    status: active
  - id: "P02E035"
    kind: project
    title: "Skill Audit"
    goal: "The updated skill creator is applied to every existing skill: descriptions audited, evaluations run on the critical ones, triggers optimized, and documentation structure normalized with parity. A skill that survives the pass is one an agent can find and use."
    status: planning
  - id: "P02E036"
    kind: project
    title: "Reusable Playbook"
    goal: "The playbook proven in one product generalizes into a platform of reusable procedures for any deliverable: hypothesis, two witnesses, gates, battery delta, compounding knowledge. The originating product keeps running without breaking its check system."
    status: planning
  - id: "P02E037"
    kind: project
    title: "Trigger Inventory"
    goal: "Every trigger check in the ecosystem is mapped and the minimum enforcement model is decided: a skill the agent runs itself, a checkpoint at each commit, or a hybrid. A trigger nobody runs is a rule in prose, and prose is the thing being replaced."
    status: planning
  - id: "P02E038"
    kind: project
    title: "User Personas"
    goal: "Persona management is a transversal standard: a canonical schema that products declare and consumers read as an input contract. A persona says who the user is, and being amnesiac is a property of the experiment, never of the persona."
    status: planning
  - id: "P02E039"
    kind: project
    title: "Cross Agent Work"
    goal: "The canonical mechanism for one agent working inside another agent's epic is decided and enforced. It never creates a second truth, both sides discover the work explicitly, no glob or git or validator breaks, and the id validator passes."
    status: active
  - id: "P02E040"
    kind: project
    title: "Check Architecture"
    goal: "The architecture of the check system scales from the single trigger of today to many triggers, with checks that attach selectively and generalize across projects that need variables. The gold standard is transcoding a government requirement into a check, including the simulation of what happens if that requirement is implied."
    status: planning
  - id: "P02E041"
    kind: project
    title: "Checks Migration"
    goal: "Kin is a CLIENT of a check system that this agent owns; illo, librarian and others are the next clients. Ownership of the engine, the schema and the promotion rules sits here; each client owns its domain folders, its checks and its executor. The axis (owner, 2026-10-30): checklist / simulated / manual — a checklist that GROWS in coverage so that new work does not re-verify old work. Epics add, modify or do-not-touch the checklist per case, and must DECLARE which (`checklist_effect: add|modify|none` + reason). See DECISION-checklist-as-assurance.md."
    status: planning
  - id: "P02E042"
    kind: project
    title: "Agent Registry"
    goal: "Every agent has an allocated number from one canonical registry, so an identifier is assigned once and never guessed. The registry is the table that the portfolio, the epic ids and the documentation all read from."
    status: active
  - id: "P02E043"
    kind: project
    title: "Fourth System"
    goal: "The invariant that a fourth system cannot be introduced was blocked in practice, and the block is recorded with its evidence. The ecosystem keeps three systems, and a proposal that would make it four has a named place to fail."
    status: active
  - id: "P02E044"
    kind: methodology
    title: "Epic Kind"
    goal: "Kind is a closed enum of epic: project, study, recipe or methodology. Each kind closes in its own way, the legal relations between kinds are stated, and three executable consumers read it. The free prose of the old epic type field died in September and nothing replaces it with prose."
    status: active
  - id: "P02E045"
    kind: methodology
    title: "Spike Epic Protocol"
    goal: "Make \"decide with evidence\" a mechanism every agent is forced through: the spike protocol becomes a skill (envelope + printer + impact gate) and the 4th `kind` becomes real (spike epics cannot close without evidence, affected epics cannot close without a recorded destination)."
    status: active
  - id: "P02E046"
    kind: project
    title: "Hook Boundary"
    goal: "A hook may observe anything and may refuse only what a file already refuses; it is never the only place where a rule exists. Applied to the thirty-seven hooks of the infrastructure catalogue, the law accepted three and refused seven that had no file behind them."
    status: active
  - id: "P02E047"
    kind: project
    title: "Delivery Annotation"
    goal: "The question is whether done needs a delivery annotation to distinguish finished from shipped in a named release, and the answer closes with a deterministic consumer. No state without an exit, and no inference from tags."
    status: planning
  - id: "P02E048"
    kind: project
    title: "Skill publication"
    goal: "Publish a skill once and ship it to three targets. One pipeline checks the frontmatter each consumer requires, then pushes the same tagged revision to OpenClaw, to Claude, and to GitHub, so that a skill that runs here also runs there, and no target silently holds a different copy. The same instrument answers which skills this project owns."
    status: planning
  - id: "P02E049"
    kind: project
    title: "Skill status"
    goal: "Give every skill one status that means one thing, derived from evidence where the evidence exists, so that a skill claiming production actually carries a battery behind the claim and a reader can sort the corpus without asking its author."
    status: planning
  - id: "P02E050"
    kind: methodology
    title: "Epic writing enforcement"
    goal: "Make epic writing a gate instead of a sentence. W1-W5 are defined once in voice 11 and enforced by parity 2.8 through four triggers (author, batch, heartbeat, commit), so that the 1657 current violations become a shrinking number with an owner per batch, not a rule that 51% of the corpus ignores. The site publishes epics, so the reader is public."
    status: active
  - id: "P02E052"
    kind: project
    title: "Agent renames"
    goal: "Execute the owner's authorized agent renames (comics→illo, podcast→curva) with the two conditions attached: old-name mentions in LIVE artifacts must disappear, and the result must be visible in Kin. Historical timeline entries are evidence and are NOT rewritten."
    status: active
  - id: "P02E053"
    kind: project
    title: "Done Timestamps"
    goal: "The roadmap projects WHEN an epic became done, so the public surface shows the last three in real order instead of the arbitrary order of the projection. The data is in the epic today and does not reach the roadmap, which blocks the consumer from computing what the source already knows."
    status: planning
  - id: "P02E054"
    kind: project
    title: "Release Home"
    goal: "The release publication mechanism needs a home after its name was reassigned to the portfolio publisher. Two outcomes are acceptable: it returns as its own skill under a name that says what it does, or the chain it guarantees is written into the contract that absorbs it."
    status: planning
  - id: "P02E057"
    kind: project
    title: "Epic Writing Sweep"
    goal: "The 105 epics that will be published carry titles of 1 to 3 words and goals of 30 to 100 English words that state what the product has, not the method used to build it. A reader of the public roadmap understands each epic from its title and goal alone."
    status: active
  - id: "P02E058"
    kind: project
    title: "Forgejo Hooks — server-side enforcement via gitea hooks"
    goal: "Server-side git hooks on forgejo (gitea hooks) for push-time enforcement. Pre-receive validates commit messages reference project/epic/task. Post-receive triggers CI/CD and logs to backstage."
    status: unknown
    reason: status_nao_canonico
  - id: "P02E059"
    kind: project
    title: "Amnesiac Testing"
    goal: "An isolated agent with no memory of the project follows the published installation and usage instructions and lists the errors it finds. It is the missing half of the publication battery: the policy validates the artifact, and this validates whether a stranger can use it. The errors it lists are the deliverable."
    status: planning
  - id: "P02E068"
    kind: project
    title: "Infrastructure epics — complete inventory"
    goal: "Epics que pertencem à infraestrutura (hooks, watchers, memory, agents, skills, ID, GUI tooling, checkpoints, scripts) e devem migrar de `backstage/` para `infrastructure/`."
    status: unknown
    reason: status_nao_canonico
  - id: "P02E069"
    kind: project
    title: "Parity Assurance — certificação determinística de confiança por projeto"
    goal: "Produzir certificação determinística de confiança para entidades sob mudança (entities under change): resposta \"Can I trust this project?\" derivada da DIREÇÃO em relação ao drift (towards_parity / towards_drift / unknown) em segundos. Transformar observações em conhecimento persistente, consultável e confiável (uma read model / projection), não em prosa de ROADMAP. Não certificar tudo o tempo todo — certificar onde existe movimento. Ciclo: movement detected → parity obligation → observation → direction classified → certification derived. PROMESSA CENTRAL: o sistema nunca fica silenciosamente inconsciente — drift não pode existir sem rastro. Garantia de que a tentativa de paridade nunca desaparece silenciosamente, não garantia de ausência de drift (impossível em sistemas vivos)."
    status: unknown
    reason: status_nao_canonico
  - id: "P02E070"
    kind: project
    title: "Contract Convergence"
    goal: "Every published epic carries a canonical id, a title of three words or fewer, a goal written in English as the product claim it makes, and an authored goal that is never empty. The rule is not advice: the next parity cycle repairs the unambiguous cases and reports the rest as residue, so an agent that forgets the rule is corrected, not published wrong."
    status: active
  - id: "P02E071"
    kind: project
    title: "Checks MVP"
    goal: "Move the ownership of verification checks, gates and checkpoints out of each product (starting with Kin) into a central harness, so the product agent keeps working unchanged while the harness governs what is verified and when. Built as a braided strangler: the device stays the same, the conductor moves."
    status: planning
  - id: "P02E072"
    kind: methodology
    title: "kind vs type"
    goal: "Decide whether `promotion` is a new `kind` and whether `type` is a second field for the same idea — and install the admission test that answers this class of question without a new argument each time. Answer recorded for P14E052 (nonlinear) and P22E030 (illo)."
    status: active
