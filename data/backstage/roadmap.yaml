    goal: "Merge context-switch workflow into backstage for morning/evening rituals, session state tracking, and project switching"
    status: done
  - id: "e031_20260519"
    kind: project
    title: "Backstage enforcement — lints + project/epic/task binding"
    goal: "Hooks as linters for Backstage. Ensure agents read and write Backstage correctly (no malformed frontmatter, no orphan files). Demand every piece of work, especially every code change, to have a project/epic/task attached."
    status: migrated
  - id: "e011_20260630"
    kind: project
