  - id: hook-family-audit
    type: review
    title: "Auditar a família de hooks como família (git, OpenClaw, Forgejo)"
    description: >
      Três famílias de hook existem e ninguém as olhou juntas: git hooks locais,
      os 37 plugin hooks do OpenClaw (só 9 dos quais podem dizer 'não'), e os
      hooks server-side do Forgejo — pre-receive, update, post-receive. O epic
      do Forgejo é draft desde 25/07 e é o único lugar onde a distinção está
      escrita: OpenClaw hooks são intenção, Forgejo hooks são enforcement.
      Cliente sempre pode fugir de hook local com --no-verify. Quem conhece
      githooks de verdade pode dizer qual hook pertence a qual família, e o que
      cada uma consegue garantir.
    status: open
    effort: medium
    time: "1 sessão: ler P02E058, P02E071, P02E046 + auditar os hooks em disco"
    skills: ["git hooks", "githooks", "release engineering", "shell", "Forgejo/Gitea"]
    response:
      mode: intake
      cta: "Auditar os hooks"
    limit: 2
    visibility: public
    evidence:
      epic: P02E058
      quote: "'OpenClaw hooks = intent. Forgejo hooks = enforcement.' — and P02E046: 'only 9 of 37 hooks can say no.'"
      library: null

