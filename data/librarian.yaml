    label: 1
    title: Proof Layer (Contract Hardening + Reader V1)
    goal: 'Fechar o Proof Layer ponta-a-ponta: Search → Evidence → citation.url → Reader → texto visível
      na posição correta com highlight. Contract Hardening (locator íntegro, proof determinístico) + Reader
      V1 (materializar o trecho exato, highlight 800ms centralizado, zero chrome). Contrato do locator
      é a peça central.'
  - id: bindery-acquisition
    label: 2
    title: Bindery Acquisition
    goal: 'Tornar o Bindery um canal de aquisição confiável e mensurável: saber quanto ele realmente cobre,
      por que os livros ficam em `wanted`, e rodar batches de download sem intervenção manual — fechando
      o loop até o índice (intake).'
  - id: indexing-master
    label: 3
    title: Indexing — Master Epic
    goal: One door into indexing. There are four epics touching this machine's index and no single place
      that says what is true *now*, what is broken, and in what order to fix it. This epic holds the live
      measurement, the failure taxonomy, and the sequence — and delegates detail to the four.
  - id: librarian-readme
    label: 4
    title: Librarian
    goal: A BYOB (Bring Your Own Books) semantic search for your personal library.
