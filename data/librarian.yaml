  - id: librarian_20260630
    label: 10
    title: Experience History & Analytics
    goal: 'Track how books are experienced via RAG citations e leitura, não só lidos. Inclui: log/biografia
      de uso (timeline, co-ocorrência), citation history, ranking de livros citados-nunca-lidos, analytics
      por cluster e auditabilidade. Absorve E002 usage-analytics e o epic Log (2026-08-11).'
