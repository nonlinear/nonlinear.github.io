    title: Weak Handshake
    goal: Migrated from old backstage (E049)
  - id: P10E068
    label: 2
    title: usage-analytics
    goal: Build usage analytics on top of `usage.jsonl` to rank topics, measure query success rate, detect
      research patterns, and identify corpus gaps — so the human can see which topics they use most, which
      queries succeed or fail, and how their research behavior evolves.
  - id: P10E066
    label: 3
    title: Topic Curation - Systems & Cybernetics
    goal: Acquire, organize, and reindex foundational books on systems, cybernetics, coordination
