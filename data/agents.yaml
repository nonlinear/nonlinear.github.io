# data/agents.yaml — quem tem página, e em qual tier.
#
# Fonte de verdade do tier: <agent>/workspace/IDENTITY.md (campo `tier:`),
# decidido top-down pelo owner (backstage P02E034). Este arquivo NÃO inventa
# tier — registra o que foi declarado, e marca `derived: true` quando o tier
# não está escrito e foi inferido do papel do agente (horizontal que serve,
# sem produto, não é flagship).
#
# TODO(owner): confirmar os `derived: true`. Nenhum deles é decisão minha.

defaults:
  tier_missing: experimental   # agente sem tier escrito e sem papel → experimental
  derived_tier: experimental

# --- TIER DECLARADO no IDENTITY.md ---
