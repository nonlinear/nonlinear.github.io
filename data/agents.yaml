# data/agents.yaml — quem tem página, e em qual tier.
#
# Fonte de verdade do tier: <agent>/workspace/IDENTITY.md (campo `tier:`),
# decidido top-down pelo owner (backstage P02E034). Este arquivo NÃO inventa
# tier. Sem `tier:` no IDENTITY.md, o agente vai para `unenrolled` e não tem
# tier nenhum — não é "experimental por omissão".
#
# Divergência entre este arquivo e o IDENTITY.md de um agente é bug deste
# arquivo. O IDENTITY ganha sempre.

defaults:
  # Nenhum tier é inventado. Sem `tier:` no IDENTITY.md, o agente não tem tier.
  tier_missing: null
  unenrolled_visible: false    # não tem página, não tem help, não entra no heartbeat

