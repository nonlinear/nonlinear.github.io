sections:
- key: active
  items:
  - id: P24E001
    label: 1
    title: Kickoff
    goal: A print-ready production practice exists, owning layout, grid, type, color, bleed and CMYK output
      end to end, distinct from the broad design agent and from the print shop. The first real project
      is identified and moving through a defined toolchain, with a baseline print spec and a reference
      library serving production.
- key: planning
  items:
  - id: P24E002
    label: 1
    title: Editions Taxonomy
    goal: 'A product taxonomy exists for the limited editions (Teixeira Kalkhoff Editions): what an edition
      is, its formats from single sheet to handmade book, series, rarity and print-run states, catalog
      fields and canonical vocabulary. It is the single source of truth for what exists, and the structural
      base the shop, analytics and pipeline all read from.'
  - id: P24E003
    label: 2
    title: Editions Analytics
    goal: 'The editions label measures what it needs to decide its next move: sell-through of a print
      run, time to sell out, average price, collector recurrence and traffic origin. Each metric is tied
      to a real decision — what to produce next, run size, price, guest artist — and anti-metrics such
      as scale and growth at any cost are explicitly refused, so niche curation never collapses into vanity
      metrics.'
  - id: P24E004
    label: 3
    title: Editions Shop
    goal: 'A storefront exists where each limited edition is presented and sold with the same rigor as
      the printed archive: an archival spec sheet, images, price and availability, a checkout and payment
      flow, art-safe shipping and packaging, and curation usable as navigation by artist, series and format.
      Affordable in price, uncompromising in standard.'
  - id: P24E005
    label: 4
    title: Rolodex Relationships
    goal: 'The label keeps its own register of relationships and activates it to launch each edition:
      drop cadence, channels, curation narrative, and the standing relationship with collectors and guest
      artists. A person carries roles, several endpoints, a relationship stage and provenance; the mailing
      list is only one case of the register. The asset is the relationship, not the channel.'
  - id: P24E006
    label: 5
    title: Editions Pipeline
    goal: 'An edition moves through a defined production pipeline: concept, art, prepress with bleed,
      safe margin, CMYK and proof, then print run, finishing, numbering and signature, and catalog registration.
      Intent becomes a printed sheet under archival technical control, with no reprint surprises, and
      the handmade book runs as a subtype of the same pipeline.'
