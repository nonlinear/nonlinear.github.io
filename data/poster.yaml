  - id: P24E001
    label: 1
    title: Poster — Kickoff
    goal: 'Estabelecer o agente Poster (📮, P24) e definir seu primeiro trabalho concreto: pipeline de
      design de pôster/print (composição, tipografia, arquivos prontos para impressão) e o primeiro projeto
      real a produzir.'
- key: planning
  items:
  - id: P24E002
    label: 1
    title: Editions — Product Taxonomy
    goal: 'Definir a taxonomia de produto das edições limitadas (Teixeira Kalkhoff Editions): o que é
      uma edição, formatos (folha individual → livro handmade), séries, estados de raridade/tiragem, campos
      de catálogo e vocabulário canônico. Base estrutural para Shop, Analytics e Pipeline.'
  - id: P24E003
    label: 2
    title: Editions — Analytics
    goal: 'Definir o que medir e por quê no selo de edições limitadas: métricas de venda, tiragem, margem,
      alcance de curadoria, comportamento de colecionador — sem reduzir a curadoria de nicho a vaidade
      de métrica. Depende da taxonomia (P24E002).'
  - id: P24E004
    label: 3
    title: Editions — Shop
    goal: 'Definir a loja das edições limitadas: apresentação do item, ficha técnica arquival, fluxo de
      compra, pagamento, frete/embalagem de arte, e a narrativa de curadoria. Acessível no preço, rigoroso
      no padrão. Consome a taxonomia.'
  - id: P24E005
    label: 4
    title: Editions — Rolodex & Relationships
    goal: 'Definir o registro próprio de relações (o Rolodex) e como cada edição é lançada: cadência de
      drops, canais/endpoints, narrativa de curadoria, relação com colecionadores e artistas convidados.
      "Mailing list" é apenas UM caso do registro — o ativo é a relação, canal-agnóstica, por papeis e
      estágios.'
  - id: P24E006
    label: 5
    title: Editions — Pipeline
    goal: 'Definir o pipeline de produção das edições: da ideia → arte → preparação de impressão (bleed,
      DPI, CMYK, prova) → tiragem → numeração/assinatura → catálogo. Onde a intenção vira folha impressa
      com controle técnico arquival.'
