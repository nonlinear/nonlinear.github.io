sections:
- key: active
  items:
  - id: P14E001
    label: 1
    title: Studio Positioning
    goal: 'The studio''s positioning, audience, tone of voice and personas are one coherent statement.
      The branding exercise and the audience research converge into a single set of audiences, and those
      audiences are the deliverable: every product page and every piece of writing addresses one of them
      by name.'
  - id: P14E002
    label: 2
    title: Living Portfolio
    goal: 'The studio site is a living portfolio: a permalink per flagship project and a section of articles,
      both fed by the progress of the agents. The two layers are one Hugo site, and the foundation for
      storytelling is laid before the first article is written.'
  - id: P14E008
    label: 3
    title: Frontend Convergence
    goal: 'One horizontal agent keeps the tools that guarantee convergence of the front end: visual, textual
      and routing. From one shared library it serves components to every project that has a front end,
      each as a theme of the same base. It is responsible for convergence, not for ownership.'
  - id: P14E009
    label: 4
    title: Root Rebuild
    goal: The root site is emptied and rebuilt on solid foundations while the personal path stays up as
      a fallback. When the new root is ready the redirect is removed and the rebuild becomes official.
  - id: P14E011
    label: 5
    title: Library Client
    goal: 'The studio is registered as the first external client of the pattern library: the boundary
      of responsibility, the versioning contract, and the hygiene mechanisms between library and client
      are written down. A client is a client, not an informal consumer.'
  - id: P14E017
    label: 6
    title: Web Analytics
    goal: The studio's sites answer questions about their own traffic from a self-hosted analytics system,
      with no third-party script and no data leaving the infrastructure. Every site reports to the same
      instance.
  - id: P14E031
    label: 7
    title: Site Build
    goal: The sitemap of the main site is manifested as a navigable site with placeholder copy, images
      and diagrams, so design can be tested on real devices slowly and iteratively behind a guarded path.
      Discrepancies are recorded as they appear, without cascading.
  - id: P14E032
    label: 8
    title: Domain Registry
    goal: One place holds the domains that are ours with expiry and state, and the candidates under consideration
      with their real price. A domain is a long-term promise, and the inventory exists so no purchase
      happens without seeing what is already paid for and until when.
  - id: P14E033
    label: 9
    title: Community Hubs
    goal: Each product has a hub where enthusiasts help each other, the owner appears occasionally, and
      a sanitized local agent answers only about that product within a per-user limit. Questions and suggestions
      become data that feed the roadmap, and the hub is the call to action on the product page.
  - id: P14E037
    label: 10
    title: Live Roadmap
    goal: 'Every portfolio project''s roadmap is a live surface on the site: the publication skill reads
      the roadmap file, exports it to a fixed contract, and the portfolio layout renders two columns with
      the latest state. No manual pass is needed to keep it current.'
- key: planning
  items:
  - id: P14E003
    label: 1
    title: Style System
    goal: 'One style system governs text, image, motion, interaction and layout across every deliverable:
      defaults that are sensible without configuration, a router that picks the right one per context,
      and exceptions that compound instead of accumulating. The router is the composition engine inside
      the system.'
  - id: P14E004
    label: 2
    title: Article Pipeline
    goal: Project work and emerging ideas become a prioritized, maturing portfolio of articles with a
      lifecycle, analytics and promotion after publication. A candidate is trackable from idea to mature
      article, and nothing is published without a place in the pipeline.
  - id: P14E007
    label: 3
    title: Site Design
    goal: 'The visual direction of the site is decided by experiment: layout, typography and color are
      tried as prototypes and compared, with the question of what the studio is trying to say driving
      each attempt. The design system emerges from those comparisons, not from a static moodboard.'
  - id: P14E010
    label: 4
    title: Markdown Decks
    goal: 'A presentation goes from Markdown to a rendered deck end to end: a template, a structure and
      a style, plus a skill so an agent can produce a new deck quickly without rediscovering the process
      each time.'
  - id: P14E012
    label: 5
    title: Longform Method
    goal: 'The route from internal investigation and external research to a long-form article is known
      before the machine that produces articles is built: verifiable claims, a strong narrative, and a
      repeatable process.'
  - id: P14E013
    label: 6
    title: Article Promotion
    goal: Every article epic, and some project epics, gets a strategic promotion that unfolds across several
      vectors with a storyboard, timing, feedback and a consistent visual signature. Promotion is part
      of the article's definition, not an afterthought.
  - id: P14E018
    label: 7
    title: Epistemic Arsenal
    goal: The studio builds an epistemic arsenal against vectoralist extraction by mining three and a
      half billion years of adversarial coevolution from biology. The patterns are extracted, tested against
      the extraction they are meant to counter, and written where a designer can use them.
  - id: P14E019
    label: 8
    title: Commons Model
    goal: The studio has a revenue model without a paywall, an agent hierarchy, and a legal structure
      that fits a commons-focused practice. Low overhead and self-hosted infrastructure are the premises,
      and the model says how the work is paid for without gating the work.
  - id: P14E029
    label: 9
    title: Library Subscription
    goal: The studio receives library components as raw source rather than compiled output, contributes
      back by pull request, and flattens everything into a single baseline for now. The request and the
      owner's decisions are recorded here before the package is cut.
  - id: P14E030
    label: 10
    title: Video Pipeline
    goal: Publish ONE reel video to every target channel from a single canonical source and pull each
      channel's performance back into one normalized ledger, so a reel is created once, delivered everywhere,
      and measured in the same place.
