    goal: "Ensure no EPUB with real body text indexes to near-zero. The block selector in extract_epub_paragraphs() omitted <div>, so EPUBs that store body text in bare <div>s (common in Anna's Archive / converted files) became invisible to semantic search. 18 books were repaired; a guard now makes the class non-silent."
