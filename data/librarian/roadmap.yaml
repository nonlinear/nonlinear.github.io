  - id: "P10E071"
    kind: project
    title: "Proof Layer"
    goal: "Every promise the reader makes about a source is backed by a contract that a test can check. The reader returns a page with its provenance, and hardening work turns each assumption into a named, verifiable claim. A claim that cannot be checked is dropped from the surface."
    status: active
  - id: "P10E072"
    kind: project
    title: "Bindery Acquisition"
    goal: "The Bindery is a measurable acquisition channel. Coverage is a number, books stuck in wanted have a named reason, and a download batch runs without manual intervention. The loop closes at the index: a book that was acquired is a book a query can find."
    status: active
  - id: "P10E073"
    kind: project
    title: "Indexing Master"
    goal: "Ingestion is one pipeline with one owner, not a set of scripts per format. A new book reaches a searchable chunk through the same stages every other book used, and a failure at any stage names the stage. The master epic holds the pipeline together across the format epics."
    status: active
