epics:
  - id: "P10E001"
    kind: project
    title: "docref"
    goal: "Avaliar e, se justificado por números, adicionar uma camada relacional/grafo sobre o corpo FAISS atual (1108 livros / 517k chunks) para capturar relações que a busca puramente semântica perde — co-citação, referências cruzadas, entidades compartilhadas, hierarquia conceitual. NÃO substituir o motor atual; estender o Middle Layer (Retrieval Engine + Corpus) com GraphRAG ou embeddings relacionais como estratégia de retrieval complementar."
    status: backlog
  - id: "P10E002"
    kind: project
    title: "Topology Analogy"
    goal: "Two clusters that share the same topology are surfaced as an analogy, not only as neighbours. Urbanism and vascular systems both carry flow, distribution, bottlenecks and circulation, so the system can name the shared shape and show both sides. The open question the epic answers is whether the system must build this or only reveal what the model already sees."
    status: planning
  - id: "P10E003"
    kind: project
    title: "Book Identity & Durable Permalinks"
    goal: "Permalinks duráveis apoiados em IDENTIDADE BIBLIOGRÁFICA PADRONIZADA — não reinventar a roda. ISO/OL/DOI já resolvem identidade de livro. O trabalho é mapear cada TIPO de fonte para o identificador canônico existente e preservá-lo no sistema."
    status: done
  - id: "P10E004"
    kind: project
    title: "Chunk Indexing"
    goal: "Index books at chunk level, paragraph by paragraph, with CFI so a citation can point at an exact passage instead of a whole book. Search stops returning a title and starts returning the text that matched it, with a durable locator that survives reindexing. The epic covers the extraction method, the index schema and the reader handoff that together make a chunk addressable end to end."
    status: archived
  - id: "P10E005"
    kind: project
    title: "Configuration"
    goal: "Transformar o Librarian específico (856 books, corpus pessoal) em um BYOB engine genérico e replicável — qualquer pessoa pode clonar, configurar e rodar com seus próprios livros. Inclui: setup zero-to-indexed, skills genéricos, documentação de onboarding, last mile de sources, mecanismo de flash (docker compose + .env)."
    status: backlog
  - id: "P10E007"
    kind: project
    title: "FAISS Memory"
    goal: "The index answers memory and latency questions on the full corpus without loading it twice: a query returns in bounded time while the process stays inside its memory budget. Batching, caching and progressive publication exist so the indexer can restart mid-corpus and continue."
    status: planning
  - id: "P10E008"
    kind: project
    title: "Evidence Provenance"
    goal: "Every answer the reader shows can be traced to a page, a chunk and a book. A claim without a resolvable source does not reach the answer surface. The model of evidence is explicit, so a missing source reads as missing instead of as confidence."
    status: planning
  - id: "P10E009"
    kind: project
    title: "Find Books Skill"
    goal: "Migrated from old backstage (E038)"
    status: backlog
  - id: "P10E010"
    kind: project
    title: "Hybrid Search"
    goal: "Migrated from old backstage (E053)"
    status: backlog
  - id: "P10E011"
    kind: project
    title: "Index Batching"
    goal: "The indexer ingests a corpus in bounded batches, caches what it has already computed, and publishes progressively. A run that dies halfway leaves a consistent pair of index and metadata, never a half-written one. Re-indexing a large intake costs the changed books, not the whole corpus."
    status: active
  - id: "P10E012"
    kind: project
    title: "Index Publication — Progressive & Atomic"
    goal: "O índice FAISS deve ser publicado progressivamente — cada livro indexado fica imediatamente consultável. Rebuild nunca destrói disponibilidade. Troca de índice é atômica: B substitui A só depois de validado."
    status: archived
  - id: "P10E013"
    kind: project
    title: "Librarian hooks"
    goal: "Migrated from old backstage (E048)"
    status: backlog
  - id: "P10E014"
    kind: project
    title: "Microkernel Platform"
    goal: "The platform runs as a minimal core that hosts capabilities as plug-ins. Retrieval, reader, indexer, log and users share one process, one port and one corpus, and each keeps its own testable contract. A capability grows inside its contract before it grows in surface."
    status: planning
  - id: "P10E015"
    kind: project
    title: "Librarian"
    goal: "A BYOB (Bring Your Own Books) semantic search for your personal library."
    status: backlog
  - id: "P10E016"
    kind: project
    title: "Reliability Layer"
    goal: "A reader can rely on the same answer twice. The system states what it knows, degrades visibly when it cannot, and never presents a stale or partial result as a fresh one. The claim under test is the answer to one question: can the system reliably say what it knows?"
    status: planning
  - id: "P10E017"
    kind: project
    title: "Interaction Log"
    goal: "Every interaction is recorded as history with its source and its outcome, so the corpus can be read as an autobiography and not only as a library. The log carries what was asked, what was returned, and which books were opened. Analytics read this log; nothing else writes it."
    status: planning
  - id: "P10E018"
    kind: project
    title: "Margin Notes"
    goal: "Migrated from old backstage (E047)"
    status: backlog
  - id: "P10E019"
    kind: project
    title: "Memory"
    goal: "Memory — persist a durable, append-only history of how the Librarian's corpus was consulted and used, with sufficient provenance to reconstruct what was knowable, what was retrieved, and what happened at a given point in time; and expose that history to the Librarian as a source for derived reasoning. É CAPACIDADE de memória, não analytics e não features: Cassandra/Missing Stair/bridges/trends emergem do uso acumulado. PostHog é storage layer (projeção); o produto é Memory. (Reframe owner 2026-09-29 — ver seção Product.)"
    status: done
  - id: "P10E020"
    kind: project
    title: "multi-format"
    goal: "Adicionar suporte a multiplos formatos alem de EPUB: Excel (.xlsx), web links (bookmarks/articles), PowerPoint (.pptx), Markdown (.md), e PDF aprimorado (imagens escaneadas + estrutura). O corpus atual e so EPUB+PDF parcial; conhecimento relevante esta em outros formatos."
    status: backlog
  - id: "P10E021"
    kind: project
    title: "OCR Capabilities"
    goal: "Adicionar OCR via Unlimited-OCR (Baidu) pra livros escaneados/sem camada de texto."
    status: backlog
  - id: "P10E022"
    kind: project
    title: "Persistent Reading State"
    goal: "Permitir que o Librarian Reader funcione tanto como superfície de verificação de citações quanto como ambiente de leitura pessoal persistente, usando a mesma infraestrutura de locator para citações, progresso de leitura, bookmarks e anotações."
    status: backlog
  - id: "P10E023"
    kind: project
    title: "Publication Postflight"
    goal: "A published landing matches the repository it came from. Postflight checks the pushed artifact against the documentation it claims to describe, and reports the difference as a gap instead of a success. Nothing is announced as published until the artifact exists where the claim says it does."
    status: active
  - id: "P10E025"
    kind: project
    title: "Research Triage"
    goal: "A research question enters the system, gets triaged against the corpus, and leaves with a decision: answered, partially answered with the gap named, or not in the corpus. The first mile of research is explicit, so a missing book is reported as a missing book and not as a weak answer."
    status: planning
  - id: "P10E026"
    kind: project
    title: "Retrieval Substrate Separation"
    goal: "Recategorize the FAISS index from 'tooling inside the reader' to **retrieval substrate** — a persistent HTTP service who"
    status: backlog
  - id: "P10E027"
    kind: project
    title: "skill-translation"
    goal: "Traduzir a SKILL.md do Librarian do formato antigo (verboso, enforcement pesado) para o formato oficial de skill do OpenClaw. O problema real nao e o conteudo (ja documentado) — e o FORMATO e o TOM (protocol enforcement vs documentacao)."
    status: backlog
  - id: "P10E028"
    kind: project
    title: "Users"
    goal: "Expandir Librarian para múltiplos usuários com mecanismo seguro de convite. Admin gera link/token, envia pra outra pessoa, essa pessoa entra na biblioteca, acessa mesmo corpus, mas cria seu próprio log isolado do admin."
    status: backlog
  - id: "P10E029"
    kind: project
    title: "Visions"
    goal: "Manter o north star do Librarian como cidadão de primeira classe: um mecanismo de captura de intenção de longo prazo onde visions (sonhos) não são backlog nem roadmap, mas bússola. Ciclo: vision → extrapolação → lacuna de corpus → novo livro → reforça a vision. Nicholas conta uma visão (com sources), o Librarian extrapola implicações/bordas/contradições, consulta o corpus (FAISS) e sugere disciplinas, autores e livros novos — tudo sandboxed até decisão conjunta. Insight central: o corpus cresce porque uma visão pediu uma disciplina que não temos; o corpus vira objeto de estudo de si mesmo."
    status: backlog
  - id: "P10E030"
    kind: project
    title: "Cover Artifact"
    goal: "Every book in `books/` HAS a cover — a cover indexer that runs IN PARALLEL to the content indexer, working the same way but over images. Completeness invariant (owner 2026-09-30): if a book is in the corpus, it has a cover. The cover is a first-class corpus artifact, on the same footing as indexer / reader / log / MCP: format-agnostic (EPUB and PDF yield the SAME cover_hash), keyed by the canonical book_id, extracted in parallel with text indexing, verified deterministically (no cover_hash ⇒ no cover), and served by every surface (registry, Reader, MCP). The cover is not decoration: its shelfmark cache_id carries the canonical provider identity (e.g. OL work ID), so indexing the cover also captures identity."
    status: archived
  - id: "P10E031"
    kind: project
    title: "Adaptive Knowledge Organization"
    goal: "Entropy-based adaptive organization: structure only when data supports it (clustering gate, boundary validation, lens-based retrieval)"
