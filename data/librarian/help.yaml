  # 3. O problema mais medido do projeto.
  # ---------------------------------------------------------------------
  - id: bounded-memory-ingestion
    type: contribution
    title: "Ingestão com memória limitada e publicação atômica do índice"
    description: >
      A ingestão carrega o corpus inteiro na memória para uma operação parcial.
      Falhou seis vezes com a mesma assinatura: o FAISS é commitado e o metadata
      não, deixando vetores órfãos. Foi "consertado" com mais RAM e depois
      declarado bloqueador. Quem já escreveu escrita atômica de índice em escala
      pode contribuir com o desenho, não só o patch.
    status: open
    effort: large
    time: "sessão de desenho + revisão; estimar juntos"
    skills: ["Python", "FAISS", "streaming", "atomic writes", "memória"]
    response:
