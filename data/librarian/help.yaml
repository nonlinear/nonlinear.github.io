  - id: rag-architecture-review
    type: review
    title: "Revisar a arquitetura de recuperação (FAISS, chunking, híbrido)"
    description: >
      O projeto roda um único FAISS IndexFlatIP (384-dim, bge-small-en-v1.5,
      chunks de 1024 chars). Busca semântica pura devolve zero para consultas
      abstratas — do tipo "como este autor pensa sobre X". Busca híbrida
      (BM25 + FAISS + RRF) foi escrita como proposta e nunca construída.
      Queremos alguém que leia o desenho e diga onde ele está errado, contra
      a literatura de IR — não alguém para implementar.
    status: open
    effort: medium
    time: "2 a 3 horas, uma vez, leitura assíncrona"
    skills: ["information retrieval", "RAG", "vector search", "chunking", "avaliação"]
    response:
