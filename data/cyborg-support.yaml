    title: Governance Forgejo Git
    goal: Agree on the administrative side of the Knowledge Commons with Eon, so the layers of access,
      permissions and naming are written down and Forgejo manifests them as real users, repos, teams and
      permissions instead of a document nobody enforces.
  - id: P03E003
    label: 2
    title: Knowledge Base
    goal: Federated registry to discover already-built / half-built projects and files, via MCP at mcp.cyborg.support
  - id: P03E011
    label: 3
    title: Configuration
    goal: Audit, document, and expand cyborg-support's access to skills, MCPs, and tools — ensuring it
      can run everything it needs to support cyborg workflows.
- key: planning
  items:
  - id: P03E005
    label: 1
    title: Financing Opportunities
    goal: Identify, evaluate and prioritise funding/grant opportunities that advance Cyborg Support's
      goals — the financing layer the project has not yet designed.
  - id: P03E006
    label: 2
    title: Benchmarks Local LLM
    goal: Design and ship an automatic, membership-part-of pipeline that collects standardized local-LLM
      benchmark reports from community devices (hardware stack + per-engine/per-model stats) into the
      members repo — privacy-preserving, schema-first, cron-driven, publishable via token/API without
      a local checkout — so the club can build reports and calculations (and emergent properties) on top
      of the data.
  - id: P03E010
    label: 3
    title: Calendar and Events
    goal: A shared calendar lists every Office Hours and Study Group session in one place, so people find
      the next gathering and its time zone without asking. Sessions publish as events with date, time,
      host, and joining link. Subscribers add the schedule to their own calendar and get reminders before
      a session starts. Hosts schedule, move, or cancel a session once and every calendar reflects it
      immediately.
  - id: P03E012
    label: 4
    title: Generic Hugo
    goal: A reusable Hugo site pattern serves as the base for each new site, so a launch needs content
      edits instead of a rebuild. The pattern ships a GitHub Pages deploy path, a calendar of upcoming
      sessions, how-to articles, and Reveal.js presentations. Authors add pages and front matter; layout,
      structured data, and deployment stay fixed. Every site built from the pattern looks consistent and
      deploys the same way.
  - id: P03E019
    label: 5
    title: Study Group
    goal: A peer learning community carries advanced cyborg techniques past what office hours can teach.
      Members join a cohort with a defined curriculum, work through case studies together, and get mentorship
      from people further along. Sessions run at a stated cadence, and discussion continues asynchronously
      between them. Learners bring a real problem, leave with a working approach, and teach that approach
      to the next cohort.
