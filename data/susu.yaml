    label: 1
    title: Radar — Continuous Discovery & Future Signals
    goal: 'Camada de inteligência prospectiva: observa via NocoDB/Reddit/Feedly, preserva proveniência
      como source of truth, e sinaliza — sem decidir, rotear ou agir.'
  - id: P00E022
    label: 2
    title: Notifications — one protocol for how and when the fleet notifies
    goal: 'Concentrar num ÚNICO protocolo (skill `notifications`) as regras que hoje estão esparsas em
      prosa entre infra, money, ring e susu: o que é um alerta, como é formatado, quem pode mandar, com
      que frequência, com que dedupe, e como o canal é escolhido (hoje email; amanhã Kin app / device
      notification). Dizer a cada agente QUANDO, COMO e QUÃO OFTEN notificar — em vez de cada um inventar.'
  - id: health-list-module
    label: 3
    title: Health List module — Susu Weekly consumer (infra → susu)
    goal: 'Consumir o artefato de saúde do infrastructure (current.json) como módulo do Susu Weekly: coletor
      read-only (mN-health.py) + seção ''Health'' no render, com spark em LINE chart. 2ª aplicação da
      POL-WEEKLY-DATA.'
  - id: OMNIVORE-AI
