sections:
- key: active
  items:
  - id: P00E003
    label: 1
    title: Reviews Corpus
    goal: 'The agent governs a second corpus under the librarian-grounding doctrine: an archive of NON-BOOK
      sources such as transcripts, articles and posts. Reviews drawn from that corpus are grounded against
      what the archive actually holds, so a claim never cites material that is absent. Each review names
      the source it came from and the archive entry that supports it. Portuguese-language inputs are accepted;
      the governing contract is English.'
  - id: P00E004
    label: 2
    title: Weekly Calculations
    goal: The weekly report's module calculations are correct and stable. Token costs render without the
      wonky numbers that the earlier build produced, and the balance module shows OpenRouter and DeepSeek
      as plain lines inside Token Costs. A thin paid balance raises a subtle mark, never a top banner.
      The report still renders when a balance capture fails, and the failure is visible rather than silent.
  - id: P00E005
    label: 3
    title: Meetings Corpus
    goal: Meetings exist as their own product with a corpus kept separate from Reviews. The corpus holds
      transcripts and their metadata, and a skill lets the owner find, browse and add to it. Transcription
      itself is a shared horizontal capability owned elsewhere; this product consumes it and never duplicates
      it. Portuguese-language meeting content is preserved verbatim.
  - id: P00E006
    label: 4
    title: Transcription Capability
    goal: Transcription exists as a horizontal capability that any product consumes, not as a report module.
      Audio is captured, transcribed and stored once, and the result is available to every consumer that
      needs it. The capability owns the engine and its runtime; products own what they do with the text.
      Nothing in the report pipeline depends on it directly, so the two can evolve apart.
  - id: P00E009
    label: 5
    title: Tooling Access Audit
    goal: The agent's access to the ecosystem's skills, MCP servers and tools is fully audited and documented.
      An inventory exists, an access matrix records what is reachable and what is blocked, and the gaps
      that limit capability are named with a suggestion for each. Tooling that expands the substrate is
      researched and proposed, never installed without a decision. The audit is repeatable, so a later
      run can show what changed.
  - id: P00E015
    label: 6
    title: Librarian Grounding
    goal: Every report that makes a claim is grounded against the current book archive before it ships.
      The Librarian answers what the corpus contains and which book entry matches, and the report confronts
      each claim with that answer. A claim with no support in the archive is marked as such, not smoothed
      over. When the archive is unavailable the gap is stated plainly rather than assumed away.
  - id: P00E018
    label: 7
    title: Modular Substrate
    goal: The worker runs on a filesystem-based event log with append-only temporal semantics. Multiple
      writers add to the substrate without a lock, and readers compose a view at query time instead of
      relying on a materialized state. History is never rewritten, so any past view can be reconstructed
      exactly. Governance is minimal by design; the substrate carries the structure, not ceremony.
  - id: P00E021
    label: 8
    title: FOSS Provider Review
    goal: A review of open-source projects establishes which parts of a provider-offer normalization strategy
      are commodity and reusable, and which gap requires the organization's own work. The question is
      what can be composed, and what is the smallest proprietary layer that preserves the strategy. Candidates
      are named with their licence, hosting posture and fit. The review informs the provider-routing decision;
      it does not implement it.
  - id: P00E023
    label: 9
    title: Omnivore Install
    goal: Omnivore runs self-hosted on the local machine through a container runtime, with the Instapaper
      archive imported for unread items only and the data cleaned before use. Android and Mac clients
      are documented so the owner can read from either. The epic ends at the install and import boundary;
      artificial intelligence over the corpus lives elsewhere. Phases are set by the owner, not by convenience.
  - id: P00E026
    label: 10
    title: Transcript Storage
    goal: 'A corpus of meeting transcripts exists with storage and retrieval, and a skill teaches how
      to find an entry, navigate its frontmatter, and add a new transcript from whatever transcription
      system a contributor uses. The capture and speech-to-text engine lives in a separate epic, so the
      corpus is not tied to one motor. Scope is deliberately narrow: storage and retrieval, nothing else.'
- key: planning
  items:
  - id: P00E017
    label: 1
    title: Radar Discovery
    goal: 'A prospective intelligence layer watches NocoDB, Reddit and Feedly for signals that are worth
      the owner''s attention. Provenance is preserved as the source of truth: every entry carries its
      origin, so a later reader can verify it. The layer signals and presents; it does not decide, route,
      or act on what it finds. Signals that stop mattering decay instead of accumulating forever.'
  - id: P00E020
    label: 2
    title: Reading Memory
    goal: The system remembers what the owner has read, not only what the corpus contains. A reading record
      captures what was read, when, and what the owner thought of it, and it lives beside the sourcing
      record rather than replacing it. Consumption data is governed here; sourcing stays with the Librarian,
      which answers corpus and match questions on request. Queries can tell the two apart without confusion.
  - id: P00E022
    label: 3
    title: Notification Protocol
    goal: One protocol defines how and when anything in the fleet notifies a human. Channels, severity
      and quiet rules are stated once, so an agent does not invent its own notification behavior. A notification
      carries what happened and where to look, and it never duplicates a report the owner can read directly.
      Alerts that fire too often are a defect in the protocol, not noise to tolerate.
  - id: P00E024
    label: 4
    title: Omnivore AI
    goal: 'Ideas for intelligence over the read-it-later corpus are discussed here: routing through the
      local model runtime, extending Reviews, and hooks that new saves could trigger. The owner sets the
      agenda, and nothing is implemented without an explicit request. The epic is a discussion record,
      so a later reader can see which ideas were raised, which were dropped, and why. It holds no running
      code.'
  - id: P00E042
    label: 5
    title: Health List Module
    goal: The weekly report consumes the health artifact that infrastructure publishes and renders it
      as a module. The module reads the current file, shows what is unhealthy in plain language, and does
      not reproduce the check itself. A missing or unreadable artifact is stated as a gap rather than
      rendered as a healthy system. Format changes are negotiated with the producing side.
