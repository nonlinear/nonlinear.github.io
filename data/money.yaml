    title: NYS Refinancing — quitação à vista do levy
    goal: Quitar NYS à vista, encerrar o payment plan $1,036×60 e reciclar o fluxo mensal em máquina dupla
      (401k loan 6.75% + mid-mortgage 4.5%)
