    label: 1
    title: Paperless AI — Qwen local via LAN (semantic search + chat)
    goal: 'Um arquivo-morto conversável e auto-organizado: buscar por sentido, conversar com documentos,
      auto-classificar. TUDO local/privado ($0, fora da cloud). OpenClaw continua o cérebro financeiro
      consumindo via API.'
  - id: finances-and-legal_nyswoes
    label: 2
    title: NYS Woes
    goal: Recuperar ~8 anos de NJ state tax pagos indevidamente
  - id: finances-and-legal_nysrefinancing
