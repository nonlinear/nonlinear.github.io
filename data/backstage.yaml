sections:
- key: active
  items:
  - id: P02E004
    label: 1
    title: Checkpoints Epic 1 — provar a máquina de lifecycle (checks + checkpoints)
    goal: 'Provar fisicamente a máquina de lifecycle: uma mudança de status dispara um checkpoint que
      executa checks; cada check produz PASS/FAIL; todos PASS autorizam a transição, qualquer FAIL a rejeita
      e registra o resultado. Entregar a estrutura mínima de Check + Checkpoint funcionando, com um toy
      check — ANTES de qualquer policy real. Epic termina quando a máquina está demonstrada, não quando
      está cheia de inteligência.'
  - id: P02E020
    label: 2
    title: Extrapolation — Nimble Companies / Handshake Protocols
    goal: Explore and document the concept of Nimble Companies — organizations that operate with autonomous
      agents in deterministic workflows — and position Backstage as the standard handshake protocol between
      those agents and companies.
  - id: P02E022
    label: 3
    title: Nurtured Cognition — POL-001 (política canônica de capacidade)
    goal: 'Canonizar a política de capacidade: antes de aumentar a inteligência do modelo, perguntar se
      o ambiente já pode carregar isso. Nutrir o ambiente, não o modelo.'
  - id: P02E031
    label: 4
    title: Policy & Skill Status Schema (canonical allow-list)
    goal: Uma única fonte canônica de statuses para POLICIES e SKILLS (policies/policy-schema.yaml), consumida
      por validator, com heartbeat reconciliando drift — espelhando o que epic-schema.yaml já faz para
      epics.
  - id: P02E032
    label: 5
    title: Org-level path (shared artifacts outside agents/)
    goal: Definir o nível canônico de-org (irmão de agents/) para artefatos compartilhados entre todos
      os agentes mas de nenhum — hoje inexistente; a work-location POL só modela o interior de agents/.
  - id: P02E034
    label: 6
    title: Project Tiers - flagship, experimental, collab
    goal: Definir a taxonomia de tiers de projeto do estúdio - TRÊS grupos (flagship, experimental, collab).
      Cada projeto DECLARA seu tier (campo mapeado internamente). A experiência pública deriva do tier
      (recursos/atenção/visual diferentes) sem que o tier seja exposto. Regras, quem vai onde, enforcement.
  - id: P02E039
    label: 7
    title: Cross-agent epic work — mecanismo canônico de ownership
    goal: 'Decidir e tornar enforced o mecanismo canônico para trabalho de um agente em epic de OUTRO
      agente (cross-agent epic work). Requisitos: (1) sem segunda verdade, (2) descoberta explícita dos
      dois lados, (3) sem quebrar glob/git/ validators, (4) passa no id-validator.sh.'
  - id: P02E042
    label: 8
    title: Agent registry — canonical P<NN> allocation table
    goal: TBD
  - id: P02E043
    label: 9
    title: NocoDB-down — 4th-system invariant blocked
    goal: TBD
  - id: P02E044
    label: 10
    title: Epic Kind — canonização organização-level
    goal: Canonizar `kind` como enum fechado de epic (project|study|recipe|methodology), com fechamento
      por kind, relações legais por kind e três consumidores executáveis — substituindo a prosa livre
      `epic_type` morta em 2026-09-28.
- key: planning
  items:
  - id: P02E005
    label: 1
    title: ID Collision Correction — reconciliação de IDs duplicados (18 grupos)
    goal: 'Resolver as 18 colisões de ID do ecossistema: quando 2+ epics compartilham o mesmo `id` no
      frontmatter, a projeção do roadmap não pode distingui-los. O padrão alvo é ID project-independent
      (id = identidade do epic, não do container; migra sem mudar). Este epic materializa a lista das
      colisões e define a migração dos ids duplicados. Done quando todo id é único no ecossistema.'
  - id: P02E016
    label: 2
    title: Help Needed — demand machine (procurement-style intake)
    goal: 'Define the INTAKE side of help_needed: a project declares a need, receives responses, and each
      response generates work items (tickets). The demand machine is upstream — it owns the declaration,
      the response lifecycle, and the routing to tickets. Procurement discipline: RFP published → proposals
      received → each proposal becomes a vendor thread.'
  - id: P02E023
    label: 3
    title: Parity Update 1 — writing updates (lint / como escrever epics)
    goal: 'Cabeça do grupo LINT (como os agentes escrevem epics). Consolida os epics de escrita/qualidade
      como notas para análise. Nome provisório — não é o que importa; o critério é NÃO PERDER nada. Writing
      updates: como escrever epics certo. ⚡ VOLTOU A PLANNING 2026-09-28 (nonlinear): o planning ainda
      não decidiu o contrato; não executar agora.'
  - id: P02E035
    label: 4
    title: Skill-Creator Rollout
    goal: Aplicar o skill-creator atualizado aos ~95 skills existentes — auditar descrições, rodar evals
      nos skills críticos, otimizar triggers, normalizar estrutura documental com parity.
  - id: P02E040
    label: 5
    title: Check Architecture — one trigger today, generalized checks tomorrow (transcodable government
      requirements)
    goal: Montar a ARQUITETURA do check system para escalar de exatamente UM trigger (commit) hoje até
      N triggers, checks que se ligam seletivamente, checks generalizados inter-projects que precisam
      de variáveis, e — o gold standard — transcodificação de requisitos de governo em checks, com simulação
      "e se eu implicar o requisito X?". Hoje NÃO se implementa isso. Hoje se MONTAM os eixos de extensão
      para que o crescimento seja troca de valor, não redesign.
  - id: P02E047
    label: 6
    title: Delivery annotation — done ≠ published (and the schema must be able to say so)
    goal: Decidir se `done` (promoção interna a Stable) precisa de uma anotação de entrega (`published_in`)
      para distinguir "acabou" de "saiu numa release nomeada" — e se sim, fechá-la com um CONSUMIDOR determinístico,
      sem criar estado sem saída nem inferência por tag.
  - id: P02E048
    label: 7
    title: Skill publication
    goal: Publish a skill once and ship it to three targets. One pipeline checks the frontmatter each
      consumer requires, then pushes the same tagged revision to OpenClaw, to Claude, and to GitHub, so
      that a skill that runs here also runs there, and no target silently holds a different copy. The
      same instrument answers which skills this project owns.
  - id: P02E049
    label: 8
    title: Skill status
    goal: Give every skill one status that means one thing, derived from evidence where the evidence exists,
      so that a skill claiming production actually carries a battery behind the claim and a reader can
      sort the corpus without asking its author.
  - id: P02E053
    label: 9
    title: Latest done on roadmap — projetar o timestamp de fechamento
    goal: 'Fazer o roadmap projetar QUANDO um epic virou done, para que a superfície pública (`done`)
      possa mostrar os últimos 3 em ordem real — e não a ordem arbitrária da projeção. Hoje o dado existe
      no epic (`lifecycle[].at`, `closed_at`) mas não chega ao roadmap, e o consumidor (skill `publication`)
      não pode calcular o que a fonte não deu. Entregar: campo projetado + projector que o emite + consumidor
      que o lê.'
  - id: P02E054
    label: 10
    title: Release discipline (P0–P8) procura casa — a skill publication virou superfície de portfolio
    goal: 'Decidir o destino do mecanismo de publicação de RELEASE (P0–P8, clean room, artifact identity
      chain) depois que o nome `publication` foi reatribuído ao publicador de portfolio (roadmap → Hugo
      data → build → push). Duas saídas aceitáveis: (a) volta como skill própria com nome que diga o que
      faz (`release`), com dono e primeiro consumidor; (b) morre declaradamente, e a policy do Librarian
      fica como documento de produto. O que não pode continuar é existir sem casa.'
