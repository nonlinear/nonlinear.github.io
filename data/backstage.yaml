sections:
- key: active
  items:
  - id: P02E004
    label: 1
    title: Checkpoint Machine
    goal: 'The lifecycle machine is proven: a status change fires a checkpoint that runs checks, each
      check returns pass or fail, all passing authorizes the transition, and any failure rejects it and
      records the result. The minimum structure of check and checkpoint works with one toy check, before
      any real policy exists.'
  - id: P02E020
    label: 2
    title: Nimble Companies
    goal: 'The concept of a nimble company is explored and written: an organization that operates with
      autonomous agents in deterministic workflows. The studio is positioned as the standard handshake
      protocol between those agents and those companies.'
  - id: P02E022
    label: 3
    title: Cognition Policy
    goal: 'The policy is canonical: before increasing the intelligence of the model, ask whether the environment
      can already carry the answer. Nurture the environment, not the model. The four questions and the
      conformance test that enforce it are part of the policy, not advice beside it.'
  - id: P02E031
    label: 4
    title: Status Schema
    goal: There is one canonical source of statuses for policies and for skills, read by the validator,
      with the heartbeat reconciling drift. It mirrors what the epic schema already does for epics, so
      a status is a value the machine knows instead of a word a writer chooses.
  - id: P02E032
    label: 5
    title: Organization Level
    goal: 'The canonical organization level is defined: a sibling of the agents directory that holds artifacts
      shared by every agent and owned by none. Today it does not exist, because the work-location policy
      models the inside of the agents directory and stops there.'
  - id: P02E034
    label: 6
    title: Project Tiers
    goal: 'The studio has three project tiers: flagship, experimental and collab. Each project declares
      its tier, the public experience derives from it in resources and attention, and the tier itself
      is never exposed to the reader. The rules, the assignations and the enforcement are part of the
      taxonomy.'
  - id: P02E039
    label: 7
    title: Cross Agent Work
    goal: The canonical mechanism for one agent working inside another agent's epic is decided and enforced.
      It never creates a second truth, both sides discover the work explicitly, no glob or git or validator
      breaks, and the id validator passes.
  - id: P02E042
    label: 8
    title: Agent Registry
    goal: Every agent has an allocated number from one canonical registry, so an identifier is assigned
      once and never guessed. The registry is the table that the portfolio, the epic ids and the documentation
      all read from.
  - id: P02E043
    label: 9
    title: Fourth System
    goal: The invariant that a fourth system cannot be introduced was blocked in practice, and the block
      is recorded with its evidence. The ecosystem keeps three systems, and a proposal that would make
      it four has a named place to fail.
  - id: P02E044
    label: 10
    title: Epic Kind
    goal: 'Kind is a closed enum of epic: project, study, recipe or methodology. Each kind closes in its
      own way, the legal relations between kinds are stated, and three executable consumers read it. The
      free prose of the old epic type field died in September and nothing replaces it with prose.'
- key: planning
  items:
  - id: P02E005
    label: 1
    title: ID Collisions
    goal: Two epics that share the same id cannot be told apart by the roadmap projection, and eighteen
      groups do. The target is an id that is the identity of the epic and not of its container, so the
      epic migrates without changing name. The epic closes when every id in the ecosystem is unique.
  - id: P02E016
    label: 2
    title: Demand Intake
    goal: 'A project declares a need, receives responses, and each response becomes work items. The intake
      side owns the declaration, the response lifecycle and the routing to tickets, following procurement
      discipline: the request is published, proposals arrive, and each proposal is a vendor thread.'
  - id: P02E023
    label: 3
    title: Writing Head
    goal: 'The group that holds how agents write epics consolidates the writing and quality epics into
      notes for analysis, under one criterion: lose nothing. The provisional name does not matter. The
      contract of the group is still undecided, so nothing is executed yet.'
  - id: P02E035
    label: 4
    title: Skill Audit
    goal: 'The updated skill creator is applied to every existing skill: descriptions audited, evaluations
      run on the critical ones, triggers optimized, and documentation structure normalized with parity.
      A skill that survives the pass is one an agent can find and use.'
  - id: P02E036
    label: 5
    title: Reusable Playbook
    goal: 'The playbook proven in one product generalizes into a platform of reusable procedures for any
      deliverable: hypothesis, two witnesses, gates, battery delta, compounding knowledge. The originating
      product keeps running without breaking its check system.'
  - id: P02E037
    label: 6
    title: Trigger Inventory
    goal: 'Every trigger check in the ecosystem is mapped and the minimum enforcement model is decided:
      a skill the agent runs itself, a checkpoint at each commit, or a hybrid. A trigger nobody runs is
      a rule in prose, and prose is the thing being replaced.'
  - id: P02E038
    label: 7
    title: User Personas
    goal: 'Persona management is a transversal standard: a canonical schema that products declare and
      consumers read as an input contract. A persona says who the user is, and being amnesiac is a property
      of the experiment, never of the persona.'
  - id: P02E040
    label: 8
    title: Check Architecture
    goal: The architecture of the check system scales from the single trigger of today to many triggers,
      with checks that attach selectively and generalize across projects that need variables. The gold
      standard is transcoding a government requirement into a check, including the simulation of what
      happens if that requirement is implied.
  - id: P02E041
    label: 9
    title: Checks Migration
    goal: 'Kin is a CLIENT of a check system that this agent owns; illo, librarian and others are the
      next clients. Ownership of the engine, the schema and the promotion rules sits here; each client
      owns its domain folders, its checks and its executor. The axis (owner, 2026-10-30): checklist /
      simulated / manual — a checklist that GROWS in coverage so that new work does not re-verify old
      work. Epics add, modify or do-not-touch the checklist per case, and must DECLARE which (`checklist_effect:
      add|modify|none` + reason). See DECISION-checklist-as-assurance.md.'
  - id: P02E047
    label: 10
    title: Delivery Annotation
    goal: The question is whether done needs a delivery annotation to distinguish finished from shipped
      in a named release, and the answer closes with a deterministic consumer. No state without an exit,
      and no inference from tags.
- key: done
  items:
  - id: visions
    label: 1
    title: Visions
    goal: A sandboxed space where articulated dreams become the Studio's north star. Each vision arrives
      with articles and sources; the epic returns interesting extrapolations, consults the library (Librarian),
      and suggests disciplines, authors, and books to enrich it. Dream → vision → extrapolation → discipline.
  - id: e021_20260630
    label: 2
    title: Surface Objects
    goal: Surface vision, agents, skills, MCPs, pinned notes
  - id: e061_20260507
    label: 3
    title: Status Check
    goal: Migrated from old backstage (E061)
