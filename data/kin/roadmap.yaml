epics:
  - id: "503-patch"
    kind: project
    title: "503 Patch — UI Honesto"
    goal: "Quando bridge/tunnel cai, o app IMPEDE o envio. Não perde mensagens. Ícone No Connection em vez de send button mentiroso."
    status: done
  - id: "P09E001"
    kind: project
    title: "Configuration"
    goal: "Criar um SSOT (single source of truth) de configuração do ecossistema de MCPs, skills e ferramentas — quem tem acesso a o quê, quais estão funcionando, quais faltam, e por quê."
    status: backlog
  - id: "P09E002"
    kind: project
    title: "Kin-Ready Agents"
    goal: "Details criteria to present agents on Kin devices, using the maximum of harness resources, as substrate, just expanding it."
    status: backlog
  - id: "P09E003"
    kind: project
    title: "Policy Propagation"
    goal: "A single product-wide policy reaches every agent that can host the product, without two agents editing the same file and without the copies diverging. The policy has one source, and an agent either carries the current version or is visibly out of date."
    status: planning
  - id: "P09E004"
    kind: project
    title: "Commenting on Markdown"
    goal: "Inline commenting on markdown documents (bubbles, messages, files). Select text → comment → agent reads + responds. Comments as native Kin events."
    status: backlog
  - id: "P09E005"
    kind: project
    title: "Embedded Tunneling"
    goal: "The bridge embeds the smallest secure tunnelling option that is open source and self-hosted, so remote access works without a third party and without asking the user to understand networking. Remote here means the central web interface and the remote app, both reached through the same embedded path."
    status: active
  - id: "P09E006"
    kind: project
    title: "Health Telemetry"
    goal: "The frequency of tunnel and bridge failures on the phone is measured, and the measurement separates tunnel flapping from a refused request from a timeout. The problem is named before it is fixed."
    status: planning
  - id: "P09E007"
    kind: project
    title: "Timeline Platform"
    goal: "The timeline gives guarantees strong enough that a new feature — bubbles, diagrams, tables — can be added without breaking scroll, gesture or state. A feature that cannot be added inside those guarantees is a change to the platform, not a feature."
    status: planning
  - id: "P09E008"
    kind: project
    title: "Testing Platform"
    goal: "The verification cycle is formal: contract, tests, report, done. Every epic proves feature correctness and platform compatibility before it counts as delivered, and the report is evidence a reader can check."
    status: planning
  - id: "P09E009"
    kind: project
    title: "Epistemic Validator"
    goal: "The library is no longer only a semantic searcher: it validates a claim against its sources. An answer that cannot be traced does not pass, and the library reports the gap instead of the nearest text."
    status: planning
  - id: "P09E010"
    kind: project
    title: "Visible Spawns"
    goal: "Agent spawns are visible in the product: a progress board, a lifecycle and the logs, so the user can see what their agents are doing without asking. This is the surface where every per-agent activity of the platform appears."
    status: planning
  - id: "P09E011"
    kind: project
    title: "Visions"
    goal: "Espaço sandboxed pra sonhar: user enuncia o que envisiona o projeto virando (com artigos e source), Kin extrapola com rigor, consulta a biblioteca e sugere novas disciplinas, autores e livros. Sonhos viram north star."
    status: done
  - id: "P09E012"
    kind: project
    title: "💭 Emoting — Micro-Expressões Glanceable do Agente"
    goal: "O agente (Kin) comunica só com texto. Texto exige leitura linear — atenção"
    status: backlog
  - id: "P09E013"
    kind: project
    title: "Frontend Compiler"
    goal: "A component defined once in the shared material language compiles to each target a product needs, so the same button is the same button in every renderer. The record was truncated in August and recovered only in part; what survives is the compiler's contract."
    status: planning
  - id: "P09E014"
    kind: project
    title: "Message Stamp"
    goal: "Every message would carry a standard stamp — device, installation, artifact, origin — born in the bridge. This is an architectural hypothesis in planning, not a contract, and the first round is research."
    status: planning
  - id: "P09E015"
    kind: project
    title: "Quality Playbook"
    goal: "The studio's playbook states how it verifies and maintains quality: a fast feedback loop with rigor, a triage at three speeds, a pipeline with promotion, assurance tests as lock-in, spawn hygiene, the protocol of rounds and the artifact gate. It is the written form of a process that already runs."
    status: active
  - id: "P09E016"
    kind: project
    title: "Midstep"
    goal: "A link that survives email resolves to the right native scheme on the right device: the bridge validates it against a per-device allowlist and hands it off in one click, with no residual web page. Each step is a midstep in an ecology, and the first case is a note."
    status: active
  - id: "P09E017"
    kind: project
    title: "Midstep Planning"
    goal: "The midstep ecology is planned before it is built: which schemes, which devices, which allowlist, and what a step returns when the target is absent. The planning epic holds the decisions the active epic executes."
    status: planning
