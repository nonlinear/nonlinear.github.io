    status: active
  - id: "P09E102"
    kind: project
    title: "Envelope Authoritative Classification"
    goal: "Stop classifying control-plane events by matching text inside the message body. Classify only by an authoritative marker: a declared type field on the envelope, or (interim) an ANCHORED match on the transport envelope. Body-substring matching is banned. Fixes two opposite defects at once."
    status: active
  - id: "P09E103"
    kind: project
    title: "Collapse by Metadata"
    goal: "Heartbeats (and other control-plane events) are shown, not hidden — but as a SINGLE collapsed pill (e.g. \"50 ❤️\"), not one bubble per event and not zero. Classification is driven by an authoritative TYPE field (metadata), never by matching substrings of the message body — so there are no false positives when a normal message merely mentions a token."
    status: active
  - id: "P09E104"
    kind: project
    title: "Image Syntax"
    goal: "The exact syntaxes that render an image in a message are locked, and vector images render instead of failing silently. Every claim was probed on the real renderer and the simulator, so the list is evidence and not guesswork."
    status: active
