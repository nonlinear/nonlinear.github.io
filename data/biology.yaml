sections:
- key: active
  items:
  - id: P17E001
    label: 1
    title: Configuration Fitness Agent
    goal: Auditing the fitness agent's access to skills, MCPs and tools exists as an ongoing capability
      map, so the agent can program workouts, search sports science, plan nutrition and write to calendar
      and reminders without hitting a missing tool. The owner uses it to see which resource is absent
      and what it would unlock before asking for a build or a new integration.
  - id: P17E003
    label: 2
    title: Configuration Cooking Agent
    goal: An inventory of the cooking agent's MCPs, skills, books and tools exists and is kept current,
      so recipe search, purchase tracking, dish costing and nutrition research each have a named resource
      behind them. The owner uses it to see which capability is covered, which is thin and what a new
      integration would add before paying for one.
  - id: P17E008
    label: 3
    title: Food Passport Dishes
    goal: 'Every cooked dish has a persistent information shadow in NocoDB. QR code on container → card
      view with full story: recipe, ingredients, cost, batches, eat history. Food Passport is the concept
      name; Dishes is the data model. NocoDB is derived data, not system of record.'
  - id: P17E009
    label: 4
    title: Cooking System Audit
    goal: 'Contract that defines the auditability architecture: artifact chain, freeze rules, merge discipline,
      and provenancial links. Core ontology: Grocery is potential demand. Pantry is current inventory.
      Batch is the assembly of inventory into food, evolving from potential to actual through the Epic
      lifecycle. Every actual quantity crossing these boundaries must be recorded.'
  - id: P17E011
    label: 5
    title: Consolidation Reconciliation Dead
    goal: Obsolete and duplicate epics are gone, live contracts are consolidated into single sources of
      truth, and pending Grocy barcodes are reconciled, so the agent navigates a clean estate. The owner
      uses a consistent epic set and a product catalogue where scanned items are linked, instead of guessing
      which copy of a contract is current.
  - id: P17E015
    label: 6
    title: Rigatoni Soup LOTE
    goal: A Rigatoni Soup batch exists, cooked from the ingredients already in the pantry and frozen in
      single portions, using the cauliflower and fish broth that no earlier soup consumed and the technique
      validated on the carrot ginger batch. The owner uses its real yield to correct the working volume
      assumption for broth based soups.
  - id: P17E016
    label: 7
    title: Health Stats Blood
    goal: 'Clinical data from the Healow patient portal is ingested and consolidated: blood work, vitals
      and medications land in one queryable history. The owner uses it to see trends over time and to
      correlate lab markers with training and nutrition, instead of reading PDFs one visit at a time.'
  - id: P17E017
    label: 8
    title: Configuration
    goal: An audit of the OpenClaw ecosystem's skills, MCPs and configuration exists, recording what this
      agent can reach, what it cannot, and which missing tools are worth building. The owner uses it to
      decide where a new tool pays for itself, rather than discovering a gap in the middle of a task.
  - id: P17E020
    label: 9
    title: Harm Reduction Acervo
    goal: 'The librarian holds a real harm reduction collection: the historiography of the movement, the
      neuroscientific critique of the disease model of addiction, and the etiology of trauma. The owner
      uses it to answer harm reduction questions from primary sources instead of the single book and its
      satellites that the library held before.'
  - id: P17E022
    label: 10
    title: Daily Regimen
    goal: 'A working daily regimen exists with each supplement and medication judged on evidence: creatine,
      tadalafil 5 mg daily, and every item the owner adds. Each entry carries dose, mechanism, what the
      trials support, what is marketing, interactions and risks, so the owner decides from a documented
      verdict instead of a product claim. The owner uses it to keep, drop or adjust each item.'
- key: planning
  items:
  - id: P17E004
    label: 1
    title: Automation
    goal: 'Automate repetitive Grocy operations: receipt OCR → purchase recording, price history tracking,
      freezer sensor integration, and scheduled batch reminders.'
  - id: P17E005
    label: 2
    title: Cooking Agent
    goal: 'The cooking agent answers kitchen questions in natural language over Grocy as the source of
      stock and librarian research as the source of culinary knowledge: what is expiring, what is missing,
      what can be cooked tonight, what a dish costs and what the shopping list should hold. The owner
      uses one conversation instead of opening the Grocy interface.'
  - id: P17E006
    label: 3
    title: Food Cost Accounting
    goal: A real production cost exists for every recipe and batch, built from historical purchase price,
      unit conversion, culinary yield and the quantity actually used. The owner uses it to compare dishes
      on cost per portion and to see where waste and yield loss eat the margin, with each figure traceable
      to a purchase and a kitchen measurement.
  - id: P17E007
    label: 4
    title: Nutrition Intelligence
    goal: 'Integrate nutrition data (USDA SR Legacy, Open Food Facts) with Grocy products — per-batch
      macros, meal-level tracking, agent queries for ''''what has the most protein per dollar''''. We''''re
      pescariano. Not tracking macros daily, but want *per-batch* visibility: - "This traybake has 35g
      protein per serving" - "What''''s the cheapest protein per gram right now?" - "Does this batch meet
      the protein target?"'
  - id: P17E012
    label: 5
    title: Batch Epic Type
    goal: 'A batch epic type exists in the model, with its own status semantics, fields and immutability
      rules, specialised from the general epic rather than bolted on as a separate system. The owner uses
      it so that every cooked or assembled batch carries a biography of a physical lot: materials claimed,
      produced, frozen and consumed.'
  - id: P17E013
    label: 6
    title: Food System Post
    goal: A post-mortem of the food system exists, written after the four soup batches and the traybake
      completed their lifecycle, judging whether the chain from purchase to product to allocation to batch
      to production to consumption to freezer to meal kept high auditability. The owner uses its invariants,
      not just its lessons, to amend the food system contract.
  - id: P17E014
    label: 7
    title: FULFILLMENT ALERT Perishable
    goal: Perishable ingredients bought for a batch epic raise a temporal obligation the moment they enter
      the pantry, and the owner is shown the date by which they must become frozen food. The system detects
      the obligation and computes a due date from real Grocy purchase data, without cooking, without changing
      batch status and without continuous nagging.
- key: done
  items:
