sections:
- key: active
  items:
  - id: P20E001
    label: 1
    title: Reproducible Capture Setup
    goal: 'A capture setup any host can mount in minutes exists: host cameras, a flat-top camera for the
      magazine, and local recordings from every remote participant. All sources carry a timestamp, so
      the deterministic pipeline aligns them and delivers a proto-edit of the full episode conversation.
      Contributors join remotely with their own local capture, and the magazine page stays visible as
      the visual anchor that triggers association.'
  - id: P20E002
    label: 2
    title: Smallest Valid Episode
    goal: 'One recorded episode proves the format works end to end. It is captured with the magazine camera,
      the host and the remote participants, aligned by timestamp, composed radially and delivered as a
      proto-edit of the whole conversation. The episode also ships its promotional reels. The artifact
      is the floor of the project: everything after it is improvement, not proof.'
  - id: P20E006
    label: 3
    title: Craft Suite Spike
    goal: 'It is known, under criteria B1 to B6, whether FilmCraft plus ffmpeg sustain the video pipeline:
      recording, timecode sync, radial composite and proto-edit. FilmCraft edits and exports, ffmpeg records
      with a timecode track, and SoundCraft is declared outside the critical path with the measurement
      that justifies it. Tooling choices for capture and editing rest on tested evidence instead of vendor
      claims.'
- key: planning
  items:
  - id: P20E004
    label: 1
    title: Learning Curve Podcast
    goal: A human machine conversation podcast in Brazilian Portuguese is published as an RSS feed inside
      the personal Hugo site. Each episode is one take of 45 to 60 minutes with a voice agent, recorded
      without editing, with two raw tracks kept side by side. The feed carries episodes, metadata and
      audio hosted outside the static site, so a listener can subscribe and hear the show as it was recorded.
  - id: P20E005
    label: 2
    title: Host Agent Selection
    goal: The host that presents the show is chosen by measurement, not by preference. A matrix of speech
      models against two personas, facilitator and co-host, is tested on latency, Brazilian Portuguese
      quality, cost and stability. Each cell produces a recorded number, and the decision on which pair
      to run stays open until an owner call sets the persona direction.
  - id: P20E008
    label: 3
    title: Episode Manifest
    goal: 'Every episode carries its own record of how it was made: stack, costs, prompts, books, sources,
      recordings and value debt, written during the pipeline. A field that was not measured is declared
      unknown, so no invented number passes as data. A reader of any episode can see what produced it
      and what it cost, without asking the producer.'
  - id: P20E010
    label: 4
    title: Voice Performance Training
    goal: The human host and the voice agent both sustain 45 to 60 minutes of continuous microphone performance
      without fatigue. Breathing, projection, rhythm and articulation are trained for one take recording,
      and the agent side is trained for dialogue at 24 kHz. It is performance coaching for recording,
      not speech therapy for a clinical condition.
  - id: P20E011
    label: 5
    title: Speech Speech Spike
    goal: A measured number says whether cloud speech to speech carries a 45 to 60 minute Brazilian Portuguese
      conversation. The same pipeline delivers a timestamped transcript built alongside, so bypassing
      speech to text costs no legibility. The podcast metadata pack, chapters, transcript, soundbite and
      person tags, comes out of that run as well, and the decision on the provider rests on data.
  - id: P20E012
    label: 6
    title: Voice Capture Hardware
    goal: The voice capture path is chosen and bought, and it produces maximum quality in a single take
      with no bespoke post production. The whole kit fits in a travel bag for two months in Brazil, and
      anything the chain needs afterwards is automated, not hand tuned. Open speakers and no headphones
      are supported through echo handling, so the host can talk and listen freely.
  - id: P20E013
    label: 7
    title: Voice Production Chain
    goal: A repeatable chain turns the raw take of each episode into publishable audio at minus sixteen
      LUFS with true peak at or below minus one point five dBTP. No bespoke editing step is needed, and
      self hosted open source tools are preferred over hardware that ties the owner to a fixed room. The
      same chain runs on a laptop, a phone recording or a hotel room input.
  - id: P20E014
    label: 8
    title: Success Vision Scenarios
    goal: The success imaginary of the videocast is written and kept, and the design of today is checked
      against it. Five expansive scenarios describe where the show goes in three years, and the audience
      tenet plus the participation doors derive from them as owner decisions. Every gap between that imaginary
      and the current design appears as a named decision, not as a feeling.
  - id: P20E015
    label: 9
    title: Librarian As Brain
    goal: The live voice agent answers from the book collection, so every episode works as promotion for
      the library. When it cites a passage it names the book and the locator, and a local bridge executes
      the search while the collection stays private. A failed search degrades to conversation without
      citation instead of inventing a reference. The tool surface stays minimal and the first call is
      warmed before the session starts.
  - id: P20E016
    label: 10
    title: Tag Support Matrix
    goal: A measured matrix names which listening players and apps render which podcast namespace tags,
      with the evidence level, app version and date for every cell. The feed decides what it emits from
      that matrix instead of folklore, and the matrix plus its test harness are published as commons.
      The official element support document gets the missing player coverage back as a pull request.
