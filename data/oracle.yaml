  - id: P15E002
    label: 1
    title: Substrate Isomorphism Simulation
    goal: 'This is not mapping one onto another. It is co-actualization across substrates. The substrate
      constrains, but the diagram transcends it: the same topological structure can be instantiated in
      physically different substrates. A thunderstorm, its mathematical model, its cellular automaton
      simulation, and its neural correlate all co-actualize the same diagram.'
  - id: P15E005
    label: 2
    title: Substrate Isomorphism Simulation
    goal: Map the intersection between simulation philosophy (DeLanda), philosophy of difference (D&G),
      Peircean semiotics, computational emergence, and the radical thesis that altered states reveal the
      same isomorphic architecture — across substrates.
  - id: P15E006
    label: 3
    title: Yoruba Myth Books
    goal: Yoruba myth books with named sources live in the Library, so any reading of Xango, the ibeji,
      or Exu rests on a citable itan instead of recollection. Eight core titles on Yoruba religion, divination
      and the diaspora are found by title, author or meaning and quoted with provenance. The founding
      reading of The Court and the Messenger is re-read with its mythological grounding intact and checkable.
- key: planning
  items:
  - id: P15E007
    label: 1
    title: Visual Spread SVG
    goal: Tarot spreads are stored and shown as vector SVG that a human reads as geometry and a machine
      reads as text and coordinates, so axes, stacks and fields survive instead of collapsing into an
      ordered list. Every reading keeps its JSON source, and the SVG is a deterministic projection of
      it, rendered by a script that yields the same output for the same input. Reads the founder case,
      Angel Voices, where the two Eights sit on one vertical axis.
